<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Erwu redraw — source review</title>
<style>*{box-sizing:border-box}select{max-width:100%}label{max-width:100%}body{max-width:1050px;margin:24px auto;padding:0 16px;background:#f8f4e9;color:#393f3e;font:16px system-ui}button,select,input{font:inherit;padding:8px}label{display:inline-block;margin:8px}canvas{display:block;width:100%;background:#e6e6e6}p{line-height:1.5}a{color:#38583e}img{max-width:100%}</style>
<h1>Erwu — photographic-reference redraw</h1><p>Source review at a constant scale within each sheet. No per-frame height fitting or dissolves: silhouette jumps remain visible. These candidates are separate from the live atlas.</p>
<label>Sheet <select id="sheet"></select></label><button id="play">Play</button><button id="step">Next frame</button><label>Frames/sec <input id="fps" type="range" min="1" max="10" value="4"></label><label><input id="flip" type="checkbox">Mirror</label>
<canvas id="view" width="1050" height="450"></canvas><input id="scrub" type="range" min="0" value="0" style="width:100%"><p id="status"></p><p><a id="source">Full source sheet</a></p><img id="full" alt="Selected Erwu source sheet">
<script>
const specs=[['model','Neutral views',2,2],['poses','Resting and expression poses',4,5],['walk-side','Side walk',4,2],['walk-front','Front walk',4,2],['walk-back','Rear walk',4,2],['walk-diag-front','Diagonal toward walk',4,2],['walk-diag-back','Diagonal away walk',4,2]];
const $=id=>document.getElementById(id);for(const [id,name] of specs)$('sheet').add(new Option(name,id));
const poseRows=[[0,260],[260,464],[464,697],[697,849],[849,1122]];
const poseCols=[[0,350,700,1050,1402],[0,350,700,1050,1402],[0,350,700,1065,1402],[0,350,700,1050,1402],[0,350,582,1070,1402]];
let img=null,spec=null,frame=0,playing=false,last=0,version=0;
async function select(){const v=++version;playing=false;$('play').textContent='Play';const s=specs.find(x=>x[0]===$('sheet').value),i=new Image();i.src='../../assets/erwu-v3/'+s[0]+'.png';await i.decode();if(v!==version)return;spec=s;img=i;frame=0;$('scrub').max=s[2]*s[3]-1;$('source').href=i.src;$('full').src=i.src;draw()}
function draw(){if(!img)return;const g=$('view').getContext('2d');let w=img.width/spec[2],h=img.height/spec[3],x=frame%spec[2]*w,y=Math.floor(frame/spec[2])*h;const fixedSize=Math.max(w,h);if(spec[0]==='poses'){const row=Math.floor(frame/4),col=frame%4,c=poseCols[row],r=poseRows[row];x=c[col]/1402*img.width;y=r[0]/1122*img.height;w=(c[col+1]-c[col])/1402*img.width;h=(r[1]-r[0])/1122*img.height;}g.fillStyle='#e6e6e6';g.fillRect(0,0,1050,450);for(const [cx,cy,size]of [[330,210,380],[830,210,120]]){const k=size/fixedSize;g.save();g.translate(cx,cy);g.scale($('flip').checked?-1:1,1);g.drawImage(img,x,y,w,h,-w*k/2,-h*k/2,w*k,h*k);g.restore()}g.fillStyle='#393f3e';g.font='16px system-ui';g.fillText('Enlarged',30,32);g.fillText('Approximate game size',720,32);$('status').textContent=spec[1]+' — frame '+(frame+1)+' / '+spec[2]*spec[3];$('scrub').value=frame;window.reviewState={sheet:spec[0],frame,count:spec[2]*spec[3],width:img.width,height:img.height}}
$('sheet').onchange=()=>select().catch(e=>{$('status').textContent=e.message;console.error(e)});$('flip').onchange=draw;$('scrub').oninput=()=>{frame=+$('scrub').value;draw()};$('step').onclick=()=>{frame=(frame+1)%(spec[2]*spec[3]);draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'};function tick(t){if(playing&&img&&t-last>1000/+$('fps').value){frame=(frame+1)%(spec[2]*spec[3]);draw();last=t}requestAnimationFrame(tick)}select().then(()=>requestAnimationFrame(tick)).catch(console.error);
</script></html>
