<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bloom</title>
<meta name="description" content="A calm one-thumb game: launch pollen from Erwu the cat and stop amethyst gems spiralling into a lavender flower.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Bloom">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1EAF1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&display=swap">
<style>
  /* One deliberate light look: lilac mist, amethyst gems, honey balls. */
  :root {
    --ground: #F1EAF1;
    --arena: #FBF7FA;
    --arena-edge: #F6EEF6;
    --petal: #F3EAF5;
    --petal-line: #E2D5EA;
    --petal-bloom: #DCCAEF;
    --rim: #D6C8E0;
    --ink: #3A3140;
    --ink-soft: #857A8E;
    --gem-light: #CDBCEB;
    --gem-deep: #5A4683;
    --honey: #D99A3E;
    --honey-soft: #F2D9AE;
    --blush: #F0D6DC;
    --halo: #E4D5F0;
    --core: #F6EAD2;
    --stamen: #EBCB8B;
    --fur: #7C7A8B;
    --fur-light: #9A97A8;
    --ear: #B9A2AE;
    --cat-eye: #CFA53B;
    --pupil: #29242F;
    --nose: #4A4555;
    --chip: rgba(255, 255, 255, 0.62);
    --hairline: rgba(58, 49, 64, 0.09);
    --font: "Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --serif: "Fraunces", "Iowan Old Style", "Palatino", Georgia, serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: light;
  }

  [hidden] { display: none !important; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  #c { position: fixed; inset: 0; width: 100vw; height: 100%; display: block; }

  #app {
    position: relative;
    height: 100%;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 6px 10px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    touch-action: none;
    max-width: 560px;
    margin-inline: auto;
  }

  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    padding-top: 6px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding-top: 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
  }
  .stat b {
    font-family: var(--serif);
    font-variation-settings: "SOFT" 100, "opsz" 48;
    font-size: 24px;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums lining-nums;
    line-height: 1.05;
  }
  .turn {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .turn b {
    font-family: var(--serif);
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-size: clamp(50px, 15vw, 68px);
    font-weight: 440;
    letter-spacing: -0.02em;
    line-height: 0.95;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .turn span {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .tools { display: flex; justify-content: flex-end; gap: 6px; padding-top: 6px; }

  .icon-btn {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border: 1px solid var(--hairline);
    border-radius: 50%;
    background: var(--chip);
    color: var(--ink-soft);
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 160ms var(--ease-out);
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn[aria-pressed="true"], .icon-btn.armed { color: var(--ink); background: #fff; }
  .icon-btn svg { width: 20px; height: 20px; }

  #stage { position: relative; min-height: 0; }

  footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    min-height: 54px;
  }
  .chips { display: flex; gap: 6px; align-items: center; }
  .chip {
    height: 38px;
    box-sizing: border-box;
    padding-inline: 12px;
    display: flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--hairline);
    border-radius: 19px;
    background: var(--chip);
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .chip i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--honey);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--honey) 22%, transparent);
  }
  #paw { padding-inline: 9px; color: var(--fur); transition: opacity 240ms var(--ease-out); }
  #paw svg { width: 20px; height: 20px; }
  #paw.used { opacity: 0.35; }
  #hint {
    margin: 0;
    font-size: 13.5px;
    color: var(--ink-soft);
    text-align: center;
    max-width: 20ch;
    text-wrap: balance;
    line-height: 1.35;
  }
  #hint.count {
    font-family: var(--serif);
    font-variation-settings: "SOFT" 100, "opsz" 48;
    font-size: 21px;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums lining-nums;
  }
  .ff-wrap { display: flex; justify-content: flex-end; }
  #ff {
    height: 38px;
    padding-inline: 13px;
    border: 1px solid var(--hairline);
    border-radius: 19px;
    background: var(--chip);
    color: var(--ink);
    font: 600 14px/1 var(--font);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #ff svg { width: 15px; height: 15px; }
  #ff[aria-pressed="true"] { background: var(--ink); color: var(--arena); border-color: var(--ink); }

  #over {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: color-mix(in srgb, var(--ground) 70%, transparent);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    animation: fade 480ms var(--ease-out);
  }
  .card {
    width: min(100%, 320px);
    box-sizing: border-box;
    background: var(--arena);
    border: 1px solid var(--hairline);
    border-radius: 28px;
    padding: 22px 24px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: 0 18px 50px rgba(90, 70, 131, 0.14), 0 2px 6px rgba(90, 70, 131, 0.06);
    animation: rise 560ms var(--ease-out);
  }
  .card canvas { width: 104px; height: 104px; }
  .card p { margin: 0; color: var(--ink-soft); font-size: 15px; }
  #over-title { margin-top: 6px; color: var(--ink); font-size: 16px; font-weight: 500; }
  .card .big {
    margin-top: 4px;
    font-family: var(--serif);
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-size: 84px;
    font-weight: 420;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums lining-nums;
  }
  .card .newbest { color: var(--gem-deep); font-weight: 600; }
  .card button {
    margin-top: 20px;
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 16px;
    background: var(--ink);
    color: var(--arena);
    font: 600 17px/1 var(--font);
    cursor: pointer;
    touch-action: manipulation;
  }
  .card button:active { transform: scale(0.98); }

  button:focus-visible { outline: 2px solid var(--gem-deep); outline-offset: 2px; }
  .haptic { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }

  .turn b.tick { animation: roll 520ms var(--ease-out); }
  .chip.bump { animation: bump 420ms var(--ease-out); }
  @keyframes roll { from { opacity: 0; transform: translateY(38%); } }
  @keyframes bump { 40% { transform: scale(1.12); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.98); } }
  @media (prefers-reduced-motion: reduce) {
    #over, .card, .turn b.tick, .chip.bump { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div id="app">
  <header>
    <div class="stat">Best <b id="best">0</b></div>
    <div class="turn"><b id="turn">1</b><span>turn</span></div>
    <div class="tools">
      <button class="icon-btn" id="restart" aria-label="Start over" title="Start over">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg>
      </button>
      <button class="icon-btn" id="sound" aria-label="Sound" aria-pressed="false" title="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="on" d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path class="on" d="M18.5 6.5a8 8 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
  </header>

  <main id="stage" aria-label="Game board"></main>

  <footer>
    <div class="chips">
      <div class="chip" id="ball-chip" aria-label="Balls"><i></i><span id="balls">3</span></div>
      <div class="chip" id="paw" title="Erwu's swat: once per run, Erwu knocks away a shape that reaches her" aria-label="Erwu's swat is ready">
        <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16" rx="5.2" ry="4.4"/><ellipse cx="5.6" cy="10.4" rx="2.1" ry="2.6"/><ellipse cx="9.4" cy="6.6" rx="2.1" ry="2.7"/><ellipse cx="14.6" cy="6.6" rx="2.1" ry="2.7"/><ellipse cx="18.4" cy="10.4" rx="2.1" ry="2.6"/></svg>
      </div>
    </div>
    <p id="hint" aria-live="polite">Pull back anywhere and let go to launch</p>
    <div class="ff-wrap"><button id="ff" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5v13l8.5-6.5zM12.5 5.5v13L21 12z"/></svg>Faster</button></div>
  </footer>
</div>

<div id="over" hidden>
  <div class="card" role="dialog" aria-labelledby="over-title">
    <canvas id="card-cat" width="312" height="312" aria-hidden="true"></canvas>
    <p id="over-title">The bloom reached Erwu</p>
    <div class="big" id="over-turn">0</div>
    <p id="over-best">turns</p>
    <button id="again">Play again</button>
  </div>
</div>

<label class="haptic" id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script>
(() => {
  'use strict';

  // ---------- Setup ----------
  const $ = (s) => document.querySelector(s);
  const stage = $('#stage'), canvas = $('#c'), ctx = canvas.getContext('2d');
  const el = {
    turn: $('#turn'), best: $('#best'), balls: $('#balls'), ballChip: $('#ball-chip'), hint: $('#hint'), paw: $('#paw'),
    ff: $('#ff'), sound: $('#sound'), restart: $('#restart'),
    over: $('#over'), overTitle: $('#over-title'), overTurn: $('#over-turn'), overBest: $('#over-best'), again: $('#again'),
    cardCat: $('#card-cat'), haptic: $('#haptic'), app: $('#app'),
  };

  const CAT_NAME = 'Erwu';
  const RINGS = 7;          // rings between the rim and Erwu
  const SECTORS = 10;       // slots per ring, and petals in the flower
  const STEP = Math.PI * 2 / SECTORS;
  const TAU = Math.PI * 2;
  const START_BALLS = 3;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const store = {
    get(k, d) { try { const v = localStorage.getItem('bloom.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('bloom.' + k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem('bloom.' + k); } catch {} },
  };

  // ---------- Theme ----------
  const C = {};
  const FONT = '"Bricolage Grotesque", ui-rounded, system-ui, sans-serif';
  const SERIF = '"Fraunces", "Iowan Old Style", Georgia, serif';
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ['ground', 'arena', 'arena-edge', 'petal', 'petal-line', 'petal-bloom', 'rim', 'ink', 'ink-soft',
      'gem-light', 'gem-deep', 'honey', 'honey-soft', 'blush', 'halo', 'core', 'stamen', 'fur', 'fur-light', 'ear', 'cat-eye', 'pupil', 'nose']) {
      C[k] = cs.getPropertyValue('--' + k).trim() || '#888888';
    }
  }
  function hexRgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const WHITE = [255, 255, 255];
  const mixA = (A, B, t) => A.map((v, i) => Math.round(v + (B[i] - v) * t));
  const mix = (a, b, t) => mixA(hexRgb(a), hexRgb(b), t);
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const lum = (c) => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;

  // ---------- Geometry ----------
  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0;
  let R = 100, coreR = 18, ballR = 3, innerR = 30, outerR = 90, dr = 10, maxShape = 9;
  let bgCache = null;
  function layout() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(3, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    const r = stage.getBoundingClientRect();
    CX = r.left + r.width / 2; CY = r.top + r.height / 2;
    R = Math.max(90, Math.min(Math.min(W, 560) / 2 - 8, r.height / 2 - 4));
    coreR = R * 0.175;
    ballR = Math.max(3.5, R * 0.03);
    maxShape = R * 0.095;
    innerR = R * 0.31;
    outerR = R - maxShape - R * 0.02;
    dr = (outerR - innerR) / (RINGS - 1);
    bgCache = null;
  }
  function ringRadius(f) {
    if (f >= 1) return innerR + dr * (f - 1);
    return coreR + (innerR - coreR) * Math.max(0, f);
  }
  // Shapes are big near the rim and shrink toward Erwu, so staggered rings
  // pack like the seeds in a flower head without touching.
  function sizeAt(f) {
    const r = ringRadius(Math.max(1, f));
    return Math.min(maxShape, 0.47 * Math.hypot(dr, r * STEP / 2));
  }
  // Each step inward also turns half a slot, so the board spirals in.
  function itemAngle(it) { return (it.sector + it.rf * 0.5) * STEP - Math.PI / 2; }
  function itemPos(it) {
    const a = itemAngle(it), rr = ringRadius(it.rf);
    return { x: Math.cos(a) * rr, y: Math.sin(a) * rr, a, r: sizeAt(it.rf) };
  }
  const sidesFor = (hp) => (hp > 4 ? 6 : hp + 2);
  function polyVerts(it, p) {
    const n = sidesFor(it.hp), out = [];
    const rot = p.a + (it.spin || 0);
    for (let i = 0; i < n; i++) {
      const t = rot + i * TAU / n;
      out.push(p.x + Math.cos(t) * p.r, p.y + Math.sin(t) * p.r);
    }
    return out;
  }
  const petalFor = (a) => ((Math.round((a + Math.PI / 2) / STEP) % SECTORS) + SECTORS) % SECTORS;

  // ---------- Sound (off until turned on) ----------
  let audio = null, soundOn = store.get('sound', false), lastNote = 0;
  const PENTA = [0, 2, 4, 7, 9];
  const noteFreq = (i) => 293.66 * Math.pow(2, (Math.floor(i / 5) * 12 + PENTA[i % 5]) / 12);
  let bus = null;
  function makeAudio() {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    bus = audio.createGain();
    bus.connect(audio.destination);
    // a short, darkened echo gives the notes a little room
    const d = audio.createDelay(); d.delayTime.value = 0.19;
    const fb = audio.createGain(); fb.gain.value = 0.28;
    const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    const wet = audio.createGain(); wet.gain.value = 0.22;
    bus.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(audio.destination);
  }
  // A kalimba-ish voice: the note plus a quiet, quickly fading overtone.
  function tone(freq, gain = 0.05, type = 'sine', dur = 0.28, delay = 0) {
    if (!audio || !soundOn) return;
    const t = audio.currentTime + delay;
    const voice = (f, g0, d0, ty) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = ty; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(g0, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d0);
      o.connect(g).connect(bus);
      o.start(t); o.stop(t + d0 + 0.02);
    };
    voice(freq, gain, dur * 1.3, type);
    voice(freq * 3.01, gain * 0.16, dur * 0.35, 'sine');
  }
  function hitNote(n) {
    const now = performance.now();
    if (now - lastNote < 38) return;
    lastNote = now;
    tone(noteFreq(Math.min(n, 14)), 0.045);
  }
  function setSound(on) {
    soundOn = on;
    store.set('sound', on);
    el.sound.setAttribute('aria-pressed', String(on));
    el.sound.querySelectorAll('.on').forEach((p) => (p.style.display = on ? '' : 'none'));
    el.sound.querySelectorAll('.off').forEach((p) => (p.style.display = on ? 'none' : ''));
    if (on && !audio) { try { makeAudio(); } catch {} }
    if (on && audio && audio.state === 'suspended') audio.resume();
  }
  // Haptics: vibrate where supported; on iOS Safari 18+, toggling a switch input gives a light tick.
  function haptic() {
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch {} return; }
    try { el.haptic.click(); } catch {}
  }

  // ---------- Game state ----------
  let items = [], balls = [], particles = [], floats = [], tweens = [];
  let turn = 1, ballCount = START_BALLS, pending = 0, petalNext = false, pawReady = true;
  let charges = new Array(SECTORS).fill(0), shownCharges = new Array(SECTORS).fill(0);
  let best = store.get('best', 0);
  let state = 'ready';  // ready | flying | advancing | over
  let shot = null, aim = null, keyAim = -Math.PI / 2, lastAim = -Math.PI / 2, timeScale = 1;
  let bloomFx = 0, swatFx = 0, stamenFx = 0;
  const freshCat = () => ({ bounce: 0, mood: 'idle', idle: 0, blink: 0, nextBlink: 3, bat: 0, batA: 0, happy: 0 });
  let cat = freshCat();
  let nextId = 1;

  function hpFor(t) {
    if (t <= 2) return 1 + (Math.random() < 0.3 ? 1 : 0);
    const base = 0.4 * t + 0.3 * ballCount;
    let h = Math.max(1, Math.round(base * (0.7 + Math.random() * 0.5)));
    if (t > 8 && Math.random() < 0.1) h = Math.round(h * 1.7);
    return h;
  }
  function spawnRing(t) {
    const free = [...Array(SECTORS).keys()].sort(() => Math.random() - 0.5);
    const maxN = t < 4 ? 3 : Math.min(6, 3 + Math.floor(t / 8));
    const n = 2 + Math.floor(Math.random() * (maxN - 1));
    const now = performance.now();
    for (let i = 0; i < n; i++) {
      const hp = hpFor(t);
      items.push({ id: nextId++, kind: 'shape', sector: free.pop(), ring: RINGS, rf: RINGS, hp, maxHp: hp, pulse: 0, spin: 0, born: now });
    }
    items.push({ id: nextId++, kind: 'orb', sector: free.pop(), ring: RINGS, rf: RINGS, born: now });
    if (t > 2 && Math.random() < 0.12) items.push({ id: nextId++, kind: 'petal', sector: free.pop(), ring: RINGS, rf: RINGS, born: now });
  }

  function serialize() {
    return {
      v: 3, turn, ballCount, petalNext, pawReady, charges: [...charges],
      items: items.filter((i) => !i.dead).map(({ kind, sector, ring, hp, maxHp }) => ({ kind, sector, ring, hp, maxHp })),
    };
  }
  function restore(run) {
    turn = run.turn; ballCount = run.ballCount; petalNext = !!run.petalNext; pawReady = run.pawReady !== false; pending = 0;
    charges = run.charges && run.charges.length === SECTORS ? [...run.charges] : new Array(SECTORS).fill(0);
    shownCharges = [...charges];
    const now = performance.now() - 1000;
    items = run.items.map((i) => ({ ...i, id: nextId++, rf: i.ring, pulse: 0, spin: 0, born: now }));
    balls = []; particles = []; floats = []; tweens = [];
    shot = null; cat = freshCat();
  }
  let readySnapshot = null;
  function markReady() {
    state = 'ready';
    readySnapshot = serialize();
    store.set('run3', readySnapshot);
    updateHud();
  }
  function newGame() {
    items = []; balls = []; particles = []; floats = []; tweens = [];
    turn = 1; ballCount = START_BALLS; pending = 0; petalNext = false; pawReady = true;
    charges = new Array(SECTORS).fill(0); shownCharges = new Array(SECTORS).fill(0);
    cat = freshCat();
    spawnRing(1);
    el.over.hidden = true;
    markReady();
  }

  // ---------- HUD ----------
  // Set text, and replay a small CSS animation on `target` when the value changes.
  function replay(node, text, cls, target) {
    if (node.textContent === text) return;
    const first = node.textContent === '';
    node.textContent = text;
    if (first) return;
    target.classList.remove(cls);
    void target.offsetWidth;
    target.classList.add(cls);
  }
  let hinted = store.get('hinted3', false);
  let restartArmed = false, restartTimer = 0;
  function updateHud() {
    replay(el.turn, String(turn), 'tick', el.turn);
    el.best.textContent = best;
    replay(el.balls, ballCount + (pending ? ` +${pending}` : ''), 'bump', el.ballChip);
    el.paw.classList.toggle('used', !pawReady);
    el.paw.setAttribute('aria-label', pawReady ? "Erwu's swat is ready" : "Erwu's swat is used up until the next full bloom");
    el.ff.hidden = !(state === 'flying' && shot && shot.t > 2.5);
    el.ff.setAttribute('aria-pressed', String(timeScale > 1));
    if (restartArmed) return;
    if (state === 'flying' && shot) {
      el.hint.className = 'count';
      el.hint.textContent = shot.hits ? `${shot.hits} ${shot.hits === 1 ? 'hit' : 'hits'}` : '';
    } else if (state === 'ready') {
      el.hint.className = '';
      el.hint.textContent = !hinted ? 'Pull back anywhere and let go to launch' : petalNext ? 'Petal ready: this shot splits in three' : '';
    }
  }

  // ---------- Turn flow ----------
  function launch(angle) {
    if (state !== 'ready') return;
    if (!hinted) { hinted = true; store.set('hinted3', true); }
    lastAim = angle;
    state = 'flying';
    shot = { angle, petal: petalNext, toLaunch: ballCount, launched: 0, timer: 0, hits: 0, t: 0 };
    petalNext = false;
    timeScale = 1;
    cat.mood = 'watch';
    stamenFx = 1;
    haptic();
    tone(noteFreq(0), 0.03, 'triangle', 0.2);
    updateHud();
  }

  function endTurn() {
    state = 'advancing';
    items = items.filter((i) => !i.dead);
    ballCount += pending; pending = 0;
    const hits = shot.hits;
    shot = null; timeScale = 1; cat.mood = 'idle';
    const word = hits >= 120 ? 'Magnificent' : hits >= 60 ? 'Gorgeous' : hits >= 25 ? 'Lovely' : null;
    if (word) addFloat(0, -coreR - R * 0.12, word, 'gem-deep', 1.35);
    updateHud();
    if (charges.every((c) => c >= 1)) fullBloom(advance);
    else advance();
  }

  function fullBloom(done) {
    bloomFx = 1;
    if (!reduced) {
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * TAU, sp = R * (0.5 + Math.random() * 0.9), r0 = coreR * 1.1;
        particles.push({ type: 'dust', x: Math.cos(a) * r0, y: Math.sin(a) * r0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: 0, vr: 0, life: 1, decay: 0.8, size: ballR * (0.3 + Math.random() * 0.35) });
      }
    }
    addFloat(0, coreR + R * 0.14, 'Full bloom', 'gem-deep', 1.5);
    [0, 2, 4, 7, 9].forEach((n, i) => tone(noteFreq(n + 5), 0.05, 'sine', 0.6, i * 0.07));
    haptic();
    for (const it of items) {
      if (it.kind !== 'shape') continue;
      it.hp -= Math.ceil(it.hp / 2);
      it.pulse = 1; it.spin = 0.6;
      if (it.hp <= 0) pop(it);
    }
    pawReady = true;
    cat.happy = 1.4;
    tween(reduced ? 0.2 : 1.0, (p) => { if (p > 0.55) { charges.fill(0); } }, () => { items = items.filter((i) => !i.dead); done(); });
  }

  function advance() {
    if (!items.some((i) => i.kind === 'shape' && !i.dead)) {
      addFloat(0, -coreR - R * 0.24, 'Clear', 'gem-deep', 1.2);
      cat.happy = 1.6;
    }
    for (const it of items) { it.from = it.rf; it.ring -= 1; }
    tween(reduced ? 0.12 : 0.6, (p) => {
      const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      for (const it of items) it.rf = it.from + (it.ring - it.from) * e;
    }, afterAdvance);
  }

  function afterAdvance() {
    let reached = false;
    for (const it of items) {
      if (it.ring > 0) continue;
      if (it.kind === 'shape') reached = true;
      else if (it.kind === 'orb') { ballCount++; it.dead = true; addFloat(0, -coreR - 14, '+1', 'honey'); }
      else if (it.kind === 'petal') { petalNext = true; it.dead = true; }
    }
    if (reached) {
      if (!pawReady) { items = items.filter((i) => !i.dead); return gameOver(); }
      // Erwu's swat: clears everything touching her and the ring just outside.
      pawReady = false;
      swatFx = 1;
      const first = items.find((i) => i.kind === 'shape' && i.ring <= 0);
      cat.bat = 1; cat.batA = itemAngle(first);
      for (const it of items) if (it.kind === 'shape' && it.ring <= 1) pop(it, true);
      addFloat(0, coreR + R * 0.14, 'Erwu swatted it away', 'ink', 1.05);
      tone(noteFreq(2), 0.06, 'triangle', 0.3); tone(noteFreq(7), 0.05, 'triangle', 0.3, 0.08);
    }
    items = items.filter((i) => !i.dead);
    turn++;
    spawnRing(turn);
    markReady();
  }

  function gameOver() {
    state = 'over';
    cat.mood = 'startled';
    store.del('run3');
    const isBest = turn > best;
    if (isBest) { best = turn; store.set('best', best); }
    [4, 2, 0].forEach((n, i) => tone(noteFreq(n), 0.05, 'sine', 0.5, i * 0.16));
    updateHud();
    setTimeout(() => {
      el.overTitle.textContent = `The bloom reached ${CAT_NAME}`;
      el.overTurn.textContent = turn;
      el.overBest.textContent = isBest ? 'turns, a new best' : `turns, best is ${best}`;
      el.overBest.classList.toggle('newbest', isBest);
      drawCardCat();
      el.over.hidden = false;
      el.again.focus({ preventScroll: true });
    }, reduced ? 200 : 1000);
  }

  // ---------- Physics ----------
  function collideShape(b, it) {
    const p = itemPos(it);
    const dx = b.x - p.x, dy = b.y - p.y;
    if (dx * dx + dy * dy > (p.r + ballR) * (p.r + ballR)) return false;
    const v = polyVerts(it, p), n = v.length / 2;
    let best2 = Infinity, qx = 0, qy = 0, inside = true;
    for (let i = 0; i < n; i++) {
      const ax = v[i * 2], ay = v[i * 2 + 1];
      const bx = v[((i + 1) % n) * 2], by = v[((i + 1) % n) * 2 + 1];
      const ex = bx - ax, ey = by - ay;
      const t = Math.max(0, Math.min(1, ((b.x - ax) * ex + (b.y - ay) * ey) / (ex * ex + ey * ey)));
      const cx = ax + ex * t, cy = ay + ey * t;
      const d2 = (b.x - cx) * (b.x - cx) + (b.y - cy) * (b.y - cy);
      if (d2 < best2) { best2 = d2; qx = cx; qy = cy; }
      if (ex * (b.y - ay) - ey * (b.x - ax) < 0) inside = false;
    }
    const d = Math.sqrt(best2);
    if (!inside && d >= ballR) return false;
    let nx, ny;
    if (d < 1e-6) { const l = Math.hypot(dx, dy) || 1; nx = dx / l; ny = dy / l; }
    else { nx = (b.x - qx) / d; ny = (b.y - qy) / d; if (inside) { nx = -nx; ny = -ny; } }
    const pen = inside ? ballR + d : ballR - d;
    b.x += nx * pen; b.y += ny * pen;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; return true; }
    return false;
  }

  function spark(b) {
    if (reduced || particles.length > 420) return;
    for (let i = 0; i < 2; i++) {
      const a = Math.atan2(b.vy, b.vx) + (Math.random() - 0.5) * 1.6, sp = R * (0.15 + Math.random() * 0.25);
      particles.push({ type: 'dust', x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: 0, vr: 0, life: 1, decay: 2.4, size: ballR * (0.22 + Math.random() * 0.2) });
    }
  }
  function onHit(it) {
    it.hp--;
    it.pulse = 1;
    if (it.hp < 4) it.spin = 0.55;
    shot.hits++;
    hitNote(shot.hits - 1);
    if (it.hp <= 0) {
      const k = petalFor(itemAngle(it));
      charges[k] = Math.min(1, charges[k] + 0.5);

    }
  }
  function pop(it, quiet) {
    it.dead = true;
    const p = itemPos(it);
    if (!quiet) { tone(noteFreq(Math.min(shot ? shot.hits : 0, 14)) / 2, 0.05, 'triangle', 0.35); haptic(); }
    if (reduced) return;
    const col = gemColor(it);
    for (let i = 0; i < 6; i++) {
      const a = p.a + (i / 6) * TAU + Math.random() * 0.5, s = R * (0.22 + Math.random() * 0.3);
      particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: a + Math.PI / 2, vr: (Math.random() - 0.5) * 6, life: 1, size: p.r * (0.34 + Math.random() * 0.18), col });
    }
  }
  function collect(it) {
    it.dead = true;
    const p = itemPos(it);
    if (it.kind === 'orb') { pending++; addFloat(p.x, p.y - p.r, '+1', 'honey'); tone(noteFreq(9), 0.04, 'sine', 0.3); }
    else { petalNext = true; addFloat(p.x, p.y - p.r, 'Petal', 'gem-deep'); tone(noteFreq(11), 0.04, 'sine', 0.4); }

  }

  const speedNow = () => R * 2.3;
  function stepBalls(dt) {
    const speed = speedNow();

    for (const b of balls) {
      for (let s = 0; s < steps && !b.caught; s++) {
        if (b.homing) {
          const d = Math.hypot(b.x, b.y) || 1;
          b.vx += (-b.x / d * speed - b.vx) * 0.12;
          b.vy += (-b.y / d * speed - b.vy) * 0.12;

        const d = Math.hypot(b.x, b.y);

        if (!b.homing) {

  // ---------- Tweens, floats ----------
  function tween(dur, fn, done) { tweens.push({ t: 0, dur, fn, done }); }
  function addFloat(x, y, text, color, scale = 1) { floats.push({ x, y, text, color, life: 1, scale }); }
  const angleDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

  // ---------- Update ----------
  function update(dt) {
    for (const tw of [...tweens]) {
      tw.t += dt;
      const p = Math.min(1, tw.t / tw.dur);
      tw.fn(p);
      if (p >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.done && tw.done(); }
    }

    // Aim eases toward the thumb so small jitters never snap it around.
    if (aim && aim.target != null) {
      if (aim.angle == null) aim.angle = aim.target;
      else aim.angle += angleDiff(aim.target, aim.angle) * Math.min(1, dt * 20);
    }

    if (state === 'flying' && shot) {
      const sdt = dt * timeScale;
      shot.t += dt;
      shot.timer -= sdt;
      while (shot.launched < shot.toLaunch && shot.timer <= 0) {
        const k = shot.petal ? shot.launched % 3 : 0;
        const a = shot.angle + k * TAU / 3;
        const r0 = coreR + ballR + 1, speed = speedNow();
        balls.push({ x: Math.cos(a) * r0, y: Math.sin(a) * r0, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, out: false, rim: 0, homing: false });
        shot.launched++;
        shot.timer += 0.07;
      }
      let left = sdt;
      while (left > 0) { const d = Math.min(left, 1 / 90); stepBalls(d); left -= d; }
      if (shot.t > 22) balls.forEach((b) => (b.homing = true));
      if (shot.t > 2.5 && el.ff.hidden) updateHud();
      if (shot.launched >= shot.toLaunch && balls.length === 0) endTurn();
      else if (shot && shot.hits !== shot.shownHits) { shot.shownHits = shot.hits; updateHud(); }
    }

    for (const it of items) { it.pulse *= Math.exp(-dt * 9); it.spin *= Math.exp(-dt * 12); }
    items = items.filter((i) => !i.dead || state === 'advancing');
    for (let k = 0; k < SECTORS; k++) shownCharges[k] += (charges[k] - shownCharges[k]) * Math.min(1, dt * 6);
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93; p.vy += R * 0.12 * dt;
      p.rot += p.vr * dt; p.life -= dt * (p.decay || 1.3);
    }
    particles = particles.filter((p) => p.life > 0);
    for (const f of floats) { f.life -= dt * 0.75; f.y -= dt * 16; }
    floats = floats.filter((f) => f.life > 0);
    bloomFx = Math.max(0, bloomFx - dt * 0.9);
    swatFx = Math.max(0, swatFx - dt * 2);
    stamenFx = Math.max(0, stamenFx - dt * 2.5);
    for (const m of motes) {
      m.y += m.vy * dt; m.x += Math.sin(m.ph + m.y / 60) * 6 * dt;
      if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
    }
    for (const d of drift) {
      d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
      if (d.y > H + 30) { d.y = -30; d.x = Math.random() * W; }
      if (d.x > W + 30) d.x = -30; if (d.x < -30) d.x = W + 30;
    }

    cat.bounce *= Math.exp(-dt * 8);
    cat.bat = Math.max(0, cat.bat - dt * 3.2);
    cat.happy = Math.max(0, cat.happy - dt);
    cat.blink = Math.max(0, cat.blink - dt);
    if (state === 'ready' && !aim) {
      cat.idle += dt;
      if (cat.idle > 1.6 && cat.mood === 'watch') cat.mood = 'idle';
      if (cat.idle > 12) cat.mood = 'sleepy';
    } else cat.idle = 0;
    cat.nextBlink -= dt;
    if (cat.nextBlink <= 0) { cat.blink = 0.14; cat.nextBlink = 2.5 + Math.random() * 4; }
  }

  // ---------- Background (painted once per resize) ----------
  const drift = [], motes = [];
  function seedDrift() {
    drift.length = 0; motes.length = 0;
    if (reduced) return;
    for (let i = 0; i < 12; i++) {
      motes.push({ x: Math.random() * W, y: Math.random() * H, vy: -(5 + Math.random() * 7), ph: Math.random() * TAU, size: 1.2 + Math.random() * 1.6 });
    }
    for (let i = 0; i < 9; i++) {
      drift.push({ x: Math.random() * W, y: Math.random() * H, vx: 4 + Math.random() * 6, vy: 7 + Math.random() * 8, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.6, size: 6 + Math.random() * 7 });
    }
  }
  function paintBackground() {
    const c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.fillStyle = C.ground; g.fillRect(0, 0, W, H);

    // warm blush from the top corner, lavender from below
    let gr = g.createRadialGradient(W * 0.1, -H * 0.02, 0, W * 0.1, -H * 0.02, H * 0.55);
    gr.addColorStop(0, rgb(hexRgb(C.blush), 0.75)); gr.addColorStop(1, rgb(hexRgb(C.blush), 0));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    gr = g.createRadialGradient(W * 0.9, H * 1.02, 0, W * 0.9, H * 1.02, H * 0.6);
    gr.addColorStop(0, rgb(hexRgb(C.halo), 0.9)); gr.addColorStop(1, rgb(hexRgb(C.halo), 0));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);

    // flower-of-life lattice: overlapping circles that form six-petal rosettes
    const a = Math.max(26, R * 0.19), rowH = a * Math.sqrt(3) / 2;
    const ink = hexRgb(C['gem-deep']);
    g.lineWidth = 1;
    for (let row = -1; row * rowH < H + a; row++) {
      for (let col = -1; col * a < W + a; col++) {
        const x = col * a + (row % 2 ? a / 2 : 0), y = row * rowH;
        const d = Math.hypot(x - CX, y - CY);
        const k = Math.min(1, Math.max(0, (d - R * 1.02) / (R * 0.6))) * Math.min(1, 0.35 + y / (H * 0.5));
        if (k <= 0) continue;
        g.strokeStyle = rgb(ink, 0.06 * k);
        g.beginPath(); g.arc(x, y, a, 0, TAU); g.stroke();
      }
    }

    // soft halo around the flower
    gr = g.createRadialGradient(CX, CY, R * 0.9, CX, CY, R * 1.45);
    gr.addColorStop(0, rgb(hexRgb(C.halo), 0.95)); gr.addColorStop(1, rgb(hexRgb(C.halo), 0));
    g.fillStyle = gr; g.beginPath(); g.arc(CX, CY, R * 1.45, 0, TAU); g.fill();

    // paper grain
    const n = document.createElement('canvas'); n.width = n.height = 96;
    const ng = n.getContext('2d'), img = ng.createImageData(96, 96);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 14;
    }
    ng.putImageData(img, 0, 0);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = g.createPattern(n, 'repeat'); g.fillRect(0, 0, c.width, c.height);
    return c;
  }

  // ---------- Drawing ----------
  function gemColor(it) {
    const t = Math.min(1, Math.log(Math.max(1, it.maxHp)) / Math.log(60));
    const cur = Math.min(1, Math.log(Math.max(1, it.hp)) / Math.log(60));
    return mix(C['gem-light'], C['gem-deep'], 0.08 + 0.92 * Math.max(cur, t * 0.4));
  }
  const easeOutBack = (p) => { const c = 1.5; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const LX = -0.5, LY = -0.86;  // light from the upper left

  function petalPath(g, a, r0, r1, width) {
    const ca = Math.cos(a), sa = Math.sin(a), px = -sa, py = ca;
    const P = (r, w) => [ca * r + px * w, sa * r + py * w];
    const b = P(r0, 0), tip = P(r1, 0);
    const l1 = P(r0 + (r1 - r0) * 0.32, -width), l2 = P(r1 + (r1 - r0) * 0.02, -width * 0.62);
    const r1a = P(r1 + (r1 - r0) * 0.02, width * 0.62), r2 = P(r0 + (r1 - r0) * 0.32, width);
    g.beginPath();
    g.moveTo(b[0], b[1]);

    g.bezierCurveTo(r1a[0], r1a[1], r2[0], r2[1], b[0], b[1]);
    g.closePath();
  }

  function drawFlower(now) {
    const g = ctx;
    // arena disc
    const gr = g.createRadialGradient(0, 0, coreR, 0, 0, R);
    gr.addColorStop(0, C.arena); gr.addColorStop(1, C['arena-edge']);
    g.fillStyle = gr;
    g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill();

    const r0 = coreR * 1.05, r1 = R * 0.965, w = R * 0.215;
    const bloomCol = hexRgb(C['petal-bloom']), deep = hexRgb(C['gem-deep']), gold = hexRgb(C.honey);
    g.save();
    const swell = 1 + bloomFx * 0.045;
    g.scale(swell, swell);
    for (let k = 0; k < SECTORS; k++) {
      const a = k * STEP - Math.PI / 2;
      petalPath(g, a, r0, r1, w);
      g.fillStyle = C.petal; g.fill();
      const ch = shownCharges[k];
      if (ch > 0.01 || bloomFx > 0) {
        g.save(); g.clip();
        if (ch > 0.01) {
          const reach = r0 + (r1 - r0) * Math.min(1, ch) * 1.02;
          const pg = g.createRadialGradient(0, 0, r0, 0, 0, reach);
          pg.addColorStop(0, rgb(bloomCol, 0.95)); pg.addColorStop(0.85, rgb(bloomCol, 0.8)); pg.addColorStop(1, rgb(bloomCol, 0));
          g.fillStyle = pg; g.beginPath(); g.arc(0, 0, reach, 0, TAU); g.fill();
        }
        if (bloomFx > 0) { g.fillStyle = rgb(bloomCol, bloomFx); g.fillRect(-R, -R, R * 2, R * 2); }
        g.restore();
      }
      // pollen dusting that gathers as the petal charges
      const specks = Math.floor(Math.min(1, ch) * 7);
      for (let i = 0; i < specks; i++) {
        const rr = r0 + (r1 - r0) * (0.08 + i * 0.075), off = w * 0.32 * Math.sin(k * 7.3 + i * 2.1);
        const x = Math.cos(a) * rr - Math.sin(a) * off, y = Math.sin(a) * rr + Math.cos(a) * off;
        g.fillStyle = rgb(gold, 0.6 - i * 0.05);
        g.beginPath(); g.arc(x, y, Math.max(1, ballR * 0.26), 0, TAU); g.fill();
      }
      petalPath(g, a, r0, r1, w);
      g.strokeStyle = C['petal-line']; g.lineWidth = 1; g.stroke();
      // centre vein, darker once the petal is fully charged
      const full = charges[k] >= 1 || bloomFx > 0;
      g.strokeStyle = full ? rgb(deep, 0.28) : rgb(hexRgb(C['petal-line']), 0.9);
      g.beginPath();
      g.moveTo(Math.cos(a) * (r0 + 6), Math.sin(a) * (r0 + 6));
      g.lineTo(Math.cos(a) * r1 * 0.9, Math.sin(a) * r1 * 0.9);
      g.stroke();
    }
    g.restore();

    // double rim, like the frame of a rose window
    g.strokeStyle = C.rim; g.lineWidth = 1.4;
    g.beginPath(); g.arc(0, 0, R, 0, TAU); g.stroke();
    g.strokeStyle = rgb(hexRgb(C.rim), 0.55); g.lineWidth = 1;
    g.beginPath(); g.arc(0, 0, R + 5, 0, TAU); g.stroke();
    // small gold beads on the frame, one per petal tip
    for (let k = 0; k < SECTORS; k++) {
      const a = k * STEP - Math.PI / 2, x = Math.cos(a) * (R + 5), y = Math.sin(a) * (R + 5);
      g.fillStyle = C.arena; g.beginPath(); g.arc(x, y, 3.4, 0, TAU); g.fill();
      g.fillStyle = rgb(gold, charges[k] >= 1 ? 1 : 0.7); g.beginPath(); g.arc(x, y, 2.3, 0, TAU); g.fill();
    }

    // slot marks: the spiral lattice shapes travel along
    const danger = state === 'ready' && items.some((i) => i.kind === 'shape' && !i.dead && i.ring === 1);
    for (let ring = 1; ring <= RINGS; ring++) {
      const rr = ringRadius(ring);
      const warn = ring === 1 && danger;
      g.fillStyle = warn ? rgb(hexRgb(C.honey), 0.55 + Math.sin(now / 280) * 0.25) : rgb(hexRgb(C.rim), 0.75);
      for (let s = 0; s < SECTORS; s++) {
        const a = (s + ring * 0.5) * STEP - Math.PI / 2;
        g.beginPath(); g.arc(Math.cos(a) * rr, Math.sin(a) * rr, warn ? 2.2 : 1.4, 0, TAU); g.fill();
      }
    }
  }

  function drawAim(now) {
    if (!aim || aim.angle == null) return;
    const angle = aim.angle;
    const dirs = petalNext ? [0, 1, 2].map((k) => angle + k * TAU / 3) : [angle];
    const honey = hexRgb(C.honey), ink = hexRgb(C['gem-deep']);
    for (const a of dirs) {
      const dx = Math.cos(a), dy = Math.sin(a);
      const start = coreR + ballR + 2;
      let x = dx * start, y = dy * start, len = 0, hit = false;
      while (len < R * 2) {
        x += dx * 3; y += dy * 3; len += 3;
        if (x * x + y * y > (R - ballR) ** 2) { hit = true; break; }
        let blocked = false;
        for (const it of items) {
          if (it.kind !== 'shape' || it.dead) continue;
          const p = itemPos(it);
          if ((x - p.x) ** 2 + (y - p.y) ** 2 < (p.r * 0.9 + ballR) ** 2) { blocked = true; break; }
        }
        if (blocked) { hit = true; break; }
      }
      const gap = Math.max(10, R * 0.06);
      const off = (now / 1000 * 30) % gap;
      for (let d = off; d < len - ballR; d += gap) {
        const k = d / len;
        g2dot(dx * (start + d), dy * (start + d), ballR * (0.5 - k * 0.15), rgb(mixA(honey, ink, k * 0.6), 0.85 - k * 0.45));
      }
      if (hit) {
        ctx.strokeStyle = rgb(honey, 0.95); ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(x, y, ballR, 0, TAU); ctx.stroke();
      }
    }
  }
  function g2dot(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.max(0.8, r), 0, TAU); ctx.fill(); }

  // Faceted amethyst: a flat table in the middle, bevelled facets lit from the upper left.
  function drawGem(it, now) {
    const p = itemPos(it);
    const born = Math.min(1, (now - it.born) / 420);
    const s = (reduced ? 1 : easeOutBack(born)) * (1 + 0.18 * it.pulse);
    const base = gemColor(it), deep = hexRgb(C['gem-deep']);
    const n = sidesFor(it.hp), rot = p.a + it.spin, r = p.r * s;
    const O = [], I = [];
    for (let i = 0; i < n; i++) {
      const t = rot + i * TAU / n;
      O.push([p.x + Math.cos(t) * r, p.y + Math.sin(t) * r]);
      I.push([p.x + Math.cos(t) * r * 0.5, p.y + Math.sin(t) * r * 0.5]);
    }
    const poly = (pts, dx = 0, dy = 0) => {
      ctx.beginPath(); ctx.moveTo(pts[0][0] + dx, pts[0][1] + dy);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] + dx, pts[i][1] + dy);
      ctx.closePath();
    };
    // soft shadow
    ctx.fillStyle = rgb(deep, 0.13);
    poly(O, 0, r * 0.2); ctx.fill();
    // facets
    ctx.lineJoin = 'round'; ctx.lineWidth = 0.8;
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, m = rot + (i + 0.5) * TAU / n;
      const lit = Math.cos(m) * LX + Math.sin(m) * LY;
      const col = lit > 0 ? mixA(base, WHITE, lit * 0.42) : mixA(base, deep, -lit * 0.3);
      ctx.fillStyle = ctx.strokeStyle = rgb(col);
      ctx.beginPath();
      ctx.moveTo(O[i][0], O[i][1]); ctx.lineTo(O[j][0], O[j][1]);
      ctx.lineTo(I[j][0], I[j][1]); ctx.lineTo(I[i][0], I[i][1]);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    const table = mixA(base, WHITE, 0.16);
    ctx.fillStyle = rgb(table); poly(I); ctx.fill();
    ctx.strokeStyle = rgb(WHITE, 0.45); ctx.lineWidth = 1; ctx.stroke();
    if (it.pulse > 0.05) { ctx.fillStyle = rgb(WHITE, it.pulse * 0.45); poly(O); ctx.fill(); }
    if (it.hp > 4) {
      ctx.fillStyle = lum(table) > 0.58 ? C.ink : '#FFFFFF';
      const size = it.hp > 99 ? r * 0.5 : r * 0.62;
      ctx.font = `600 ${size}px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(it.hp, p.x, p.y + size * 0.06);
    }
  }

  function drawPickup(it, now) {
    const p = itemPos(it);
    const born = Math.min(1, (now - it.born) / 420);
    const breathe = 1 + Math.sin(now / 420 + it.id) * 0.06;
    const s = (reduced ? 1 : easeOutBack(born)) * breathe;
    const honey = hexRgb(C.honey), soft = hexRgb(C['honey-soft']);
    ctx.save();
    ctx.translate(p.x, p.y); ctx.scale(s, s);
    if (it.kind === 'orb') {
      // a pollen cluster: one grain in the middle, six circling it
      ctx.fillStyle = rgb(soft, 0.45);
      ctx.beginPath(); ctx.arc(0, 0, p.r * 0.66, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgb(honey, 0.5); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, p.r * 0.66, 0, TAU); ctx.stroke();
      ctx.save(); ctx.rotate(now / 2400 + it.id);
      for (let k = 0; k < 6; k++) {
        const a = k * TAU / 6;
        ctx.fillStyle = rgb(honey, 0.85);
        ctx.beginPath(); ctx.arc(Math.cos(a) * p.r * 0.42, Math.sin(a) * p.r * 0.42, Math.max(1.3, p.r * 0.08), 0, TAU); ctx.fill();
      }
      ctx.restore();
      const og = ctx.createRadialGradient(-ballR * 0.3, -ballR * 0.35, ballR * 0.1, 0, 0, ballR * 1.05);
      og.addColorStop(0, '#FFF3D6'); og.addColorStop(1, rgb(honey));
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(0, 0, ballR * 1.05, 0, TAU); ctx.fill();
    } else {
      ctx.rotate(now / 1800);
      for (let k = 0; k < 5; k++) {
        ctx.save(); ctx.rotate(k * TAU / 5);
        ctx.fillStyle = rgb(k % 2 ? soft : honey, 0.95);
        ctx.beginPath(); ctx.ellipse(0, -p.r * 0.36, p.r * 0.2, p.r * 0.34, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = rgb(honey);
      ctx.beginPath(); ctx.arc(0, 0, p.r * 0.14, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function lens(g, s) {
    g.beginPath(); g.moveTo(0, -s);
    g.quadraticCurveTo(s * 0.62, 0, 0, s);
    g.quadraticCurveTo(-s * 0.62, 0, 0, -s);
    g.closePath();
  }

  // Erwu: a round-faced blue-grey shorthair with amber eyes, a slate nose
  // and a famously unimpressed half-lidded look. Moods:
  //   idle      half-lidded, slow blinks
  //   watch     eyes wide, pupils big, following the aim or the balls
  //   sleepy    eyes closed after a long wait
  //   startled  round eyes, ears back (game over)
  //   happy     smiling eyes after a clear, a full bloom or a swat
  // Ears flatten when a shape is one ring away. A paw bats at each ball it catches.
  function drawCat(g, s, now, o) {
    const scale = 1 + o.bounce * 0.05 + (o.mood === 'sleepy' && !reduced ? Math.sin(now / 1100) * 0.015 : 0);
    g.save();
    g.scale(scale, scale);
    g.translate(0, -0.06 * s);

    for (const side of [-1, 1]) {
      g.save();
      g.translate(side * 0.4 * s, -0.36 * s);
      g.rotate(side * o.earsBack * 0.75);
      g.fillStyle = C.fur;
      g.beginPath();
      g.moveTo(side * 0.22 * s, 0.14 * s);
      g.quadraticCurveTo(side * 0.21 * s, -0.36 * s, side * 0.1 * s, -0.45 * s);
      g.quadraticCurveTo(side * 0.04 * s, -0.47 * s, -side * 0.22 * s, -0.1 * s);
      g.closePath(); g.fill();
      g.fillStyle = C.ear;
      g.beginPath();
      g.moveTo(side * 0.13 * s, 0.03 * s);
      g.quadraticCurveTo(side * 0.13 * s, -0.25 * s, side * 0.08 * s, -0.32 * s);
      g.quadraticCurveTo(side * 0.02 * s, -0.3 * s, -side * 0.1 * s, -0.08 * s);
      g.closePath(); g.fill();
      g.restore();
    }

    g.fillStyle = C.fur;
    g.beginPath(); g.ellipse(0, 0, 0.64 * s, 0.58 * s, 0, 0, TAU); g.fill();
    for (const side of [-1, 1]) { g.beginPath(); g.ellipse(side * 0.3 * s, 0.24 * s, 0.33 * s, 0.27 * s, 0, 0, TAU); g.fill(); }
    g.beginPath(); g.ellipse(0, 0.33 * s, 0.27 * s, 0.22 * s, 0, 0, TAU); g.fill();
    // fluffy tufts on the crown and at the cheeks
    const tuft = (x, y, dx, dy, w) => {
      g.beginPath(); g.moveTo(x - w * s, y); g.lineTo(x + dx * s, y + dy * s); g.lineTo(x + w * s, y); g.closePath(); g.fill();
    };
    tuft(-0.14 * s, -0.54 * s, -0.04, -0.1, 0.06);
    tuft(0.0, -0.57 * s, 0.01, -0.1, 0.06);
    tuft(0.13 * s, -0.54 * s, 0.05, -0.09, 0.06);
    for (const side of [-1, 1]) {
      g.beginPath();
      g.moveTo(side * 0.58 * s, 0.14 * s); g.lineTo(side * 0.72 * s, 0.26 * s); g.lineTo(side * 0.56 * s, 0.32 * s);
      g.closePath(); g.fill();
    }
    // faint tabby marks on the forehead, as in the photo
    g.strokeStyle = rgb(mixA(hexRgb(C.fur), hexRgb(C.pupil), 0.28), 0.55);
    g.lineWidth = Math.max(1, s * 0.035); g.lineCap = 'round';
    for (const [x, y0, y1] of [[-0.1, -0.46, -0.3], [0, -0.5, -0.32], [0.1, -0.46, -0.3]]) {
      g.beginPath(); g.moveTo(x * s, y0 * s); g.lineTo(x * 0.8 * s, y1 * s); g.stroke();
    }

    const watching = o.look != null || o.mood === 'watch';
    let lid = o.mood === 'sleepy' ? 1 : watching ? 0.08 : 0.46;
    if (o.blink > 0 && o.mood !== 'sleepy') lid = 1;
    const er = 0.135 * s;
    for (const side of [-1, 1]) {
      const ex = side * 0.28 * s, ey = 0;
      g.lineCap = 'round';
      if (o.happy > 0 && o.mood !== 'startled') {
        g.strokeStyle = C.pupil; g.lineWidth = Math.max(1.4, s * 0.05);
        g.beginPath(); g.arc(ex, ey + 0.05 * s, er * 0.75, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke();
        continue;
      }
      if (lid >= 1 && o.mood !== 'startled') {
        g.strokeStyle = C.pupil; g.lineWidth = Math.max(1.4, s * 0.05);
        g.beginPath(); g.arc(ex, ey - 0.03 * s, er * 0.8, 0.18 * Math.PI, 0.82 * Math.PI); g.stroke();
        continue;
      }
      g.save();
      g.beginPath(); g.arc(ex, ey, er, 0, TAU); g.clip();
      g.fillStyle = C['cat-eye']; g.fillRect(ex - er, ey - er, er * 2, er * 2);
      const lx = o.look == null ? side * -0.012 * s : Math.cos(o.look) * 0.045 * s;
      const ly = o.look == null ? 0 : Math.sin(o.look) * 0.045 * s;
      const pw = o.mood === 'startled' ? er * 0.72 : watching ? er * 0.62 : er * 0.26;
      g.fillStyle = C.pupil;
      g.beginPath(); g.ellipse(ex + lx, ey + ly, pw, er * 0.8, 0, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.85)';
      g.beginPath(); g.arc(ex + lx + er * 0.3, ey + ly - er * 0.35, er * 0.2, 0, TAU); g.fill();
      if (o.mood !== 'startled' && lid > 0) {
        const top = ey - er, lidY = top + er * 2 * lid;
        g.fillStyle = C.fur;
        g.beginPath();
        g.moveTo(ex - er * 1.2, top - er); g.lineTo(ex + er * 1.2, top - er);
        g.lineTo(ex + er * 1.2, lidY + side * er * 0.22 * lid); g.lineTo(ex - er * 1.2, lidY - side * er * 0.22 * lid);
        g.closePath(); g.fill();
        g.strokeStyle = C.pupil; g.lineWidth = Math.max(1, s * 0.035);
        g.beginPath();
        g.moveTo(ex - er, lidY - side * er * 0.18 * lid); g.lineTo(ex + er, lidY + side * er * 0.18 * lid);
        g.stroke();
      }
      g.restore();
    }

    g.fillStyle = C.nose;
    g.beginPath();
    g.moveTo(-0.075 * s, 0.17 * s);
    g.quadraticCurveTo(0, 0.14 * s, 0.075 * s, 0.17 * s);
    g.quadraticCurveTo(0.02 * s, 0.25 * s, 0, 0.255 * s);
    g.quadraticCurveTo(-0.02 * s, 0.25 * s, -0.075 * s, 0.17 * s);
    g.fill();
    g.strokeStyle = C.nose; g.lineWidth = Math.max(1, s * 0.03); g.lineCap = 'round';
    g.beginPath();
    if (o.mood === 'startled') g.ellipse(0, 0.34 * s, 0.035 * s, 0.045 * s, 0, 0, TAU);
    else {
      g.moveTo(0, 0.255 * s); g.lineTo(0, 0.29 * s);
      g.arc(-0.05 * s, 0.29 * s, 0.05 * s, 0, 0.8 * Math.PI);
      g.moveTo(0, 0.29 * s);
      g.arc(0.05 * s, 0.29 * s, 0.05 * s, Math.PI, 0.2 * Math.PI, true);
    }
    g.stroke();

    g.strokeStyle = rgb(hexRgb(C['ink-soft']), 0.4); g.lineWidth = 1;
    for (const side of [-1, 1]) {
      for (const k of [-1, 0, 1]) {
        g.beginPath();
        g.moveTo(side * 0.44 * s, 0.26 * s + k * 0.04 * s);
        g.lineTo(side * 1.0 * s, 0.2 * s + k * 0.13 * s);
        g.stroke();
      }
    }

    for (const side of [-1, 1]) {
      let px = side * 0.2 * s, py = 0.66 * s;
      const batting = o.bat > 0 && (Math.cos(o.batA) >= 0 ? 1 : -1) === side;
      if (batting) {
        const k = Math.sin(o.bat * Math.PI) * (o.big ? 1.6 : 1);
        px += Math.cos(o.batA) * 0.5 * s * k;
        py += Math.sin(o.batA) * 0.5 * s * k;
      }
      g.fillStyle = C.fur;
      g.beginPath(); g.ellipse(px, py, 0.19 * s, 0.14 * s, 0, 0, TAU); g.fill();
      g.fillStyle = C['fur-light'];
      g.beginPath(); g.ellipse(px, py + 0.04 * s, 0.14 * s, 0.08 * s, 0, 0, TAU); g.fill();
      g.strokeStyle = rgb(hexRgb(C.fur), 0.9); g.lineWidth = Math.max(1, s * 0.025);
      for (const t of [-0.05, 0.05]) { g.beginPath(); g.moveTo(px + t * s, py + 0.02 * s); g.lineTo(px + t * s, py + 0.11 * s); g.stroke(); }
    }
    g.restore();
  }

  function catPose() {
    let look = null;
    if (aim && aim.angle != null) look = aim.angle;
    else if (state === 'flying' && balls.length) { const b = balls[balls.length - 1]; look = Math.atan2(b.y, b.x); }
    const danger = state === 'ready' && items.some((i) => i.kind === 'shape' && !i.dead && i.ring === 1);
    return {
      mood: cat.mood, look, blink: cat.blink, happy: cat.happy, bounce: cat.bounce,
      bat: cat.bat, batA: cat.batA, big: swatFx > 0,
      earsBack: cat.mood === 'startled' ? 1 : danger ? 0.7 : 0,
    };
  }

  function drawCardCat() {
    const c = el.cardCat, g = c.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, c.width, c.height);
    g.translate(c.width / 2, c.height / 2);
    g.fillStyle = C.core;
    g.beginPath(); g.arc(0, 0, c.width * 0.46, 0, TAU); g.fill();
    drawCat(g, c.width * 0.36, 0, { mood: 'startled', look: null, blink: 0, happy: 0, bounce: 0, bat: 0, batA: 0, earsBack: 1 });
  }

  function draw(now) {
    if (!bgCache) { readTheme(); bgCache = paintBackground(); }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bgCache, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // drifting petals behind the flower
    const driftCol = hexRgb(C['petal-bloom']);
    for (const d of drift) {
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot);
      ctx.fillStyle = rgb(driftCol, 0.55); lens(ctx, d.size); ctx.fill();
      ctx.restore();
    }
    const gold = hexRgb(C.honey);
    for (const m of motes) {
      const tw = 0.45 + 0.35 * Math.sin(now / 700 + m.ph);
      ctx.fillStyle = rgb(gold, tw * 0.18);
      ctx.beginPath(); ctx.arc(m.x, m.y, m.size * 3, 0, TAU); ctx.fill();
      ctx.fillStyle = rgb(gold, tw);
      ctx.beginPath(); ctx.arc(m.x, m.y, m.size, 0, TAU); ctx.fill();
    }

    ctx.translate(CX, CY);
    drawFlower(now);
    drawAim(now);

    for (const it of items) {
      if (it.dead) continue;
      if (it.kind === 'shape') drawGem(it, now); else drawPickup(it, now);
    }

    const goldA = hexRgb(C.honey);
    for (const p of particles) {
      const a = Math.max(0, Math.min(1, p.life * 1.4));
      if (p.type === 'dust') {
        ctx.fillStyle = rgb(goldA, a);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
        continue;
      }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = rgb(mixA(p.col, WHITE, 0.25), a);
      lens(ctx, p.size); ctx.fill();
      ctx.restore();
    }

    const honey = hexRgb(C.honey), hsoft = hexRgb(C['honey-soft']);
    // Balls are pollen: a soft glow, a lit sphere, and a trail of fading dust.
    for (const b of balls) {
      const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp;
      [[1.7, 0.55, 0.45], [2.9, 0.4, 0.3], [4, 0.28, 0.16]].forEach(([d, r, a]) => {
        ctx.fillStyle = rgb(honey, a);
        ctx.beginPath(); ctx.arc(b.x - ux * ballR * d, b.y - uy * ballR * d, ballR * r, 0, TAU); ctx.fill();
      });
      ctx.fillStyle = rgb(hsoft, 0.4);
      ctx.beginPath(); ctx.arc(b.x, b.y, ballR * 1.8, 0, TAU); ctx.fill();
      const bg = ctx.createRadialGradient(b.x - ballR * 0.35, b.y - ballR * 0.4, ballR * 0.1, b.x, b.y, ballR);
      bg.addColorStop(0, '#FFF3D6'); bg.addColorStop(0.55, rgb(mixA(honey, WHITE, 0.2))); bg.addColorStop(1, rgb(honey));
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(b.x, b.y, ballR, 0, TAU); ctx.fill();
    }

    // The golden heart of the flower: a ring of stamens around Erwu's cushion.
    const st = hexRgb(C.stamen);
    for (let i = 0; i < 22; i++) {
      const a = i * TAU / 22 + 0.07, long = i % 2 === 0;
      const r1 = coreR * (long ? 1.3 : 1.18) + stamenFx * coreR * 0.14 * (long ? 1 : 0.6);
      ctx.strokeStyle = rgb(st, 0.8); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * coreR * 0.96, Math.sin(a) * coreR * 0.96); ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.stroke();
      ctx.fillStyle = rgb(honey, long ? 0.95 : 0.7);
      ctx.beginPath(); ctx.arc(Math.cos(a) * r1, Math.sin(a) * r1, long ? Math.max(1.6, ballR * 0.36) : Math.max(1.2, ballR * 0.26), 0, TAU); ctx.fill();
    }
    // Erwu's cushion
    ctx.fillStyle = rgb(hexRgb(C['gem-deep']), 0.08);
    ctx.beginPath(); ctx.arc(0, coreR * 0.08, coreR * 1.02, 0, TAU); ctx.fill();
    ctx.fillStyle = C.core;
    ctx.beginPath(); ctx.arc(0, 0, coreR, 0, TAU); ctx.fill();
    ctx.strokeStyle = C.stamen; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, coreR, 0, TAU); ctx.stroke();
    if (swatFx > 0) {
      ctx.strokeStyle = rgb(honey, swatFx * 0.8); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, coreR + (1 - swatFx) * R * 0.35, 0, TAU); ctx.stroke();
    }
    drawCat(ctx, coreR, now, catPose());

    // petal charge: three small petals around Erwu
    if (petalNext && state !== 'over') {
      const base = (aim && aim.angle != null) ? aim.angle : now / 2000;
      for (let k = 0; k < 3; k++) {
        const a = base + k * TAU / 3, r = coreR + ballR * 2.4;
        ctx.save(); ctx.translate(Math.cos(a) * r, Math.sin(a) * r); ctx.rotate(a + Math.PI / 2);
        ctx.fillStyle = rgb(honey, 0.9); lens(ctx, ballR * 1.2); ctx.fill();
        ctx.restore();
      }
    }

    for (const f of floats) {
      const alpha = Math.min(1, f.life * 1.6);
      ctx.font = `500 ${Math.round(R * 0.085 * f.scale)}px ${SERIF}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, R * 0.028);
      ctx.strokeStyle = rgb(hexRgb(C.arena), alpha * 0.92);
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = rgb(hexRgb(C[f.color] || C.ink), alpha);
      ctx.fillText(f.text, f.x, f.y);
    }

    // thumb joystick: where you pressed, and how far you've pulled
    if (aim && aim.sx != null) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const ink = hexRgb(C['gem-deep']);
      const dx = aim.cx - aim.sx, dy = aim.cy - aim.sy, len = Math.hypot(dx, dy), max = 46;
      const k = len > max ? max / len : 1;
      ctx.strokeStyle = rgb(ink, 0.22); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(aim.sx, aim.sy, max, 0, TAU); ctx.stroke();
      ctx.fillStyle = rgb(ink, 0.08);
      ctx.beginPath(); ctx.arc(aim.sx, aim.sy, AIM_DEAD, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgb(ink, 0.25);
      ctx.beginPath(); ctx.moveTo(aim.sx, aim.sy); ctx.lineTo(aim.sx + dx * k, aim.sy + dy * k); ctx.stroke();
      ctx.fillStyle = aim.target != null ? rgb(hexRgb(C.honey), 0.95) : rgb(ink, 0.3);
      ctx.beginPath(); ctx.arc(aim.sx + dx * k, aim.sy + dy * k, 9, 0, TAU); ctx.fill();
    }
  }

  // ---------- Input ----------
  // Pull back like a slingshot: the shot flies opposite to your drag.
  // Inside the small dead zone the aim holds still instead of flipping.
  const AIM_DEAD = 22;
  function aimFrom(e) {
    aim.cx = e.clientX; aim.cy = e.clientY;
    const dx = aim.sx - e.clientX, dy = aim.sy - e.clientY;
    if (Math.hypot(dx, dy) > AIM_DEAD) aim.target = Math.atan2(dy, dx);
  }
  el.app.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    if (state !== 'ready' || !el.over.hidden) return;
    aim = { sx: e.clientX, sy: e.clientY, cx: e.clientX, cy: e.clientY, target: null, angle: null, id: e.pointerId };
    cat.mood = 'watch';
    try { el.app.setPointerCapture(e.pointerId); } catch {}
  });
  el.app.addEventListener('pointermove', (e) => {
    if (!aim || e.pointerId !== aim.id) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    aimFrom(events.length ? events[events.length - 1] : e);
  });
  const release = (e) => {
    if (!aim || e.pointerId !== aim.id) return;
    const pulled = Math.hypot(aim.sx - e.clientX, aim.sy - e.clientY);
    const a = aim.angle != null ? aim.angle : aim.target;
    aim = null;
    // Letting go back near the start cancels the shot.
    if (e.type === 'pointerup' && a != null && pulled > AIM_DEAD * 0.6) { keyAim = a; launch(a); }
  };
  el.app.addEventListener('pointerup', release);
  el.app.addEventListener('pointercancel', release);

  window.addEventListener('keydown', (e) => {
    if (state !== 'ready' || !el.over.hidden) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      keyAim += (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 0.01 : 0.05);
      aim = { angle: keyAim, target: keyAim, id: 'key' };
      cat.mood = 'watch';
      e.preventDefault();
    } else if ((e.key === ' ' || e.key === 'Enter') && aim && aim.id === 'key') {
      const a = aim.angle; aim = null; launch(a);
      e.preventDefault();
    }
  });

  el.ff.addEventListener('click', () => { timeScale = timeScale > 1 ? 1 : 3; updateHud(); });
  el.sound.addEventListener('click', () => { setSound(!soundOn); if (soundOn) tone(noteFreq(7), 0.04); });
  el.again.addEventListener('click', newGame);
  el.restart.addEventListener('click', () => {
    if (state === 'flying' || state === 'advancing') return;
    if (restartArmed) {
      restartArmed = false; clearTimeout(restartTimer);
      el.restart.classList.remove('armed');
      newGame();
      return;
    }
    restartArmed = true;
    el.restart.classList.add('armed');
    el.hint.className = '';
    el.hint.textContent = 'Tap again to start over';
    restartTimer = setTimeout(() => { restartArmed = false; el.restart.classList.remove('armed'); updateHud(); }, 2600);
  });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }

  function start(data) {
    readTheme();
    layout();
    seedDrift();
    new ResizeObserver(() => { layout(); }).observe(stage);
    window.addEventListener('resize', layout);
    setSound(soundOn);
    const run = (data && data.run) || store.get('run3', null);
    if (run && run.v === 3 && run.items && run.items.length) { restore(run); markReady(); }
    else newGame();
    updateHud();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { updateHud(); });
    requestAnimationFrame(frame);
  }

  window.claude?.hot?.snapshot?.(() => ({ run: state === 'over' ? null : readySnapshot }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
