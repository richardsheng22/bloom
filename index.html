<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bloom</title>
<meta name="description" content="A calm one-thumb garden game: launch pollen from Erwu the cat, coax buds into bloom, and grow a garden that remembers every shot.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Bloom">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3ECDD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&display=swap">
<style>
  /* A storybook garden: warm cream paper, moss and sage, walnut frames,
     petal-pink blooms, with dusty lavender as the accent. */
  :root {
    --ground: #F3ECDD;
    --arena: #FBF6EA;
    --arena-edge: #E3E8CD;
    --petal: #FFFBF3;
    --petal-line: #E8D9C3;
    --petal-bloom: #F4C3C9;
    --rim: #B08A62;
    --ink: #3F3326;
    --ink-soft: #85745F;
    --bud-light: #F7CBD2;
    --bud-deep: #8A5D8F;
    --honey: #D9A13E;
    --honey-soft: #F5E2A6;
    --blush: #F6DCCF;
    --halo: #E6EBCF;
    --core: #F6E8D0;
    --stamen: #E8C47E;
    --sage: #A9B994;
    --moss: #6E8A4A;
    --leaf-dark: #4F6B37;
    --sky: #A8C8DF;
    --lavender: #B7A2D6;
    --butter: #F2D478;
    --walnut: #8A6444;
    --walnut-light: #C7A27A;
    --fur: #6E6C78;
    --fur-light: #928E9A;
    --ear: #B9A2AE;
    --cat-eye: #D9B452;
    --pupil: #29242F;
    --nose: #4A4555;
    --chip: #FBF4E4;
    --stitch: rgba(138, 100, 68, 0.38);
    --hairline: rgba(110, 80, 50, 0.16);
    --font: "Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --serif: "Fraunces", "Iowan Old Style", "Palatino", Georgia, serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    color-scheme: light;
  }

  [hidden] { display: none !important; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  #c { position: fixed; inset: 0; width: 100vw; height: 100%; display: block; }

  #app {
    position: relative;
    height: 100%;
    box-sizing: border-box;
    padding-inline: 16px;
    padding-block: 6px 10px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    touch-action: none;
    max-width: 560px;
    margin-inline: auto;
  }

  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    padding-top: 6px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding-top: 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
  }
  .stat b {
    font-family: var(--serif);
    font-variation-settings: "SOFT" 100, "opsz" 48;
    font-size: 24px;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums lining-nums;
    line-height: 1.05;
  }
  .turn {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .turn b {
    font-family: var(--serif);
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-size: clamp(50px, 15vw, 68px);
    font-weight: 440;
    letter-spacing: -0.02em;
    line-height: 0.95;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .turn span {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .tools { display: flex; justify-content: flex-end; gap: 6px; padding-top: 6px; }

  .icon-btn {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 1px solid var(--hairline);
    border-radius: 50%;
    background: var(--chip);
    outline: 1.5px dashed var(--stitch);
    outline-offset: -5px;
    box-shadow: 0 1.5px 0 rgba(110, 80, 50, 0.12);
    color: var(--ink-soft);
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 160ms var(--ease-out);
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn[aria-pressed="true"], .icon-btn.armed { color: var(--ink); background: #FFFDF6; }
  .icon-btn.armed { color: var(--walnut); outline-color: var(--walnut); }
  .icon-btn svg { width: 20px; height: 20px; }

  #stage { position: relative; min-height: 0; }

  footer {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    min-height: 54px;
  }
  .chips { display: flex; gap: 6px; align-items: center; }
  .chip {
    height: 38px;
    box-sizing: border-box;
    padding-inline: 12px;
    display: flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--hairline);
    border-radius: 19px;
    background: var(--chip);
    outline: 1.5px dashed var(--stitch);
    outline-offset: -5px;
    box-shadow: 0 1.5px 0 rgba(110, 80, 50, 0.12);
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .chip i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--honey);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--honey) 22%, transparent);
  }
  #paw { padding-inline: 10px; color: var(--fur); transition: opacity 240ms var(--ease-out); }
  #paw svg { width: 20px; height: 20px; }
  #paw.used { opacity: 0.35; }
  #hint {
    margin: 0;
    font-size: 13.5px;
    color: var(--ink-soft);
    text-align: center;
    max-width: 24ch;
    text-wrap: balance;
    line-height: 1.35;
  }
  #hint.count {
    font-family: var(--serif);
    font-variation-settings: "SOFT" 100, "opsz" 48;
    font-size: 21px;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums lining-nums;
  }
  .ff-wrap { display: flex; justify-content: flex-end; }
  #ff {
    height: 38px;
    padding-inline: 13px;
    border: 1px solid var(--hairline);
    border-radius: 19px;
    background: var(--chip);
    outline: 1.5px dashed var(--stitch);
    outline-offset: -5px;
    box-shadow: 0 1.5px 0 rgba(110, 80, 50, 0.12);
    color: var(--ink);
    font: 600 14px/1 var(--font);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #ff svg { width: 22px; height: 16px; color: #8DB3D0; }
  #ff[aria-pressed="true"] { background: #EAF2F8; outline-color: #6E9CBF; }
  #ff[aria-pressed="true"] svg { color: #6E9CBF; }
  #ff[aria-pressed="true"] svg path { animation: gust 900ms linear infinite; }
  @keyframes gust { to { stroke-dashoffset: -16; } }

  /* Garden progress: five buds that fill as the garden grows. */
  .garden { display: flex; gap: 4px; margin-top: 6px; padding-left: 2px; }
  .garden i {
    width: 10px;
    height: 10px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-sizing: border-box;
    border: 1.3px dashed var(--stitch);
    transition: background-color 400ms var(--ease-out), border-color 400ms var(--ease-out);
  }
  .garden i.on { background: var(--petal-bloom); border: 1.3px solid color-mix(in srgb, var(--petal-bloom) 55%, var(--walnut)); }

  #over {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: color-mix(in srgb, var(--ground) 70%, transparent);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    animation: fade 480ms var(--ease-out);
  }
  .card {
    width: min(100%, 320px);
    box-sizing: border-box;
    background: var(--arena);
    border: 1px solid var(--hairline);
    outline: 1.5px dashed var(--stitch);
    outline-offset: -9px;
    border-radius: 28px;
    padding: 22px 24px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: 0 18px 50px rgba(110, 80, 50, 0.16), 0 2px 6px rgba(110, 80, 50, 0.08);
    animation: rise 560ms var(--ease-out);
  }
  .card canvas { width: 104px; height: 104px; }
  .card p { margin: 0; color: var(--ink-soft); font-size: 15px; }
  #over-title { margin-top: 6px; color: var(--ink); font-size: 16px; font-weight: 500; }
  .card .big {
    margin-top: 4px;
    font-family: var(--serif);
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-size: 84px;
    font-weight: 420;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums lining-nums;
  }
  .card .newbest { color: var(--bud-deep); font-weight: 600; }
  .card .note { margin-top: 10px; font-size: 13.5px; text-wrap: balance; }
  /* the run's garden news: a small stitched list, one row per bed or seed */
  .over-garden-title { margin: 2px 0 6px; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-soft); }
  .over-garden { list-style: none; margin: 0 auto; padding: 4px 0; max-width: 260px; text-align: left; border-block: 1px dashed var(--stitch); }
  .over-garden li { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 8px; padding: 5px 2px; }
  .over-garden li + li { border-top: 1px solid var(--hairline); }
  .over-garden i { width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.6), 0 0 0 1px var(--hairline); }
  .over-garden i.rare { background: radial-gradient(circle at 35% 30%, #fff 0 14%, var(--c) 15%); }
  .over-garden b { display: block; font: 500 14px/1.15 var(--serif); color: var(--ink); }
  .over-garden small { display: block; font-size: 11.5px; color: var(--ink-soft); }
  #over { overflow-y: auto; }
  @media (max-height: 680px) {
    #over { padding: 12px; }
    .card { padding: 14px 20px 16px; }
    .card canvas { width: 76px; height: 76px; }
    .card .big { font-size: 60px; }
    #over-title { font-size: 15px; }
    .card .note { margin-top: 6px; }
    .over-garden li { padding: 3px 2px; }
    .over-garden-title { margin-bottom: 3px; }
  }
  .over-garden span { font-size: 12px; font-weight: 600; color: var(--moss); }
  .card .wood { margin-top: 20px; width: 100%; }
  .wood {
    height: 52px;
    border: 1px solid #6E4E33;
    border-radius: 14px;
    background: linear-gradient(180deg, #A37A55, var(--walnut) 55%, #7A573A);
    outline: 1.5px dashed rgba(251, 244, 228, 0.55);
    outline-offset: -6px;
    box-shadow: 0 2px 0 #6E4E33, inset 0 1px 0 rgba(255, 255, 255, 0.18);
    color: #FFF8EA;
    text-shadow: 0 1px 0 rgba(60, 40, 20, 0.35);
    font: 600 17px/1 var(--font);
    cursor: pointer;
    touch-action: manipulation;
  }
  .wood:active { transform: scale(0.98); }
  /* a painted wooden sign, like the garden's: grain in the board, a serif label, and a sprig at
     each end (the sprigs sit just outside the board, so they never cover the label) */
  .wood {
    position: relative;
    background:
      repeating-linear-gradient(177deg, rgba(255,235,205,0.07) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(183deg, rgba(60,35,15,0.08) 0 1px, transparent 1px 13px),
      linear-gradient(180deg, #A9825D, var(--walnut) 55%, #7A573A);
    font-family: var(--serif, "Fraunces", Georgia, serif); font-weight: 500; letter-spacing: 0.01em;
  }
  .wood::before, .wood::after {
    content: ""; position: absolute; top: 50%; width: 24px; height: 24px; margin-top: -12px; pointer-events: none;
    background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><g fill='%23F6C9D3' stroke='%23C98F9C' stroke-width='.7'><ellipse cx='13' cy='6.5' rx='3.2' ry='5.2' transform='rotate(0 13 13)'/><ellipse cx='13' cy='6.5' rx='3.2' ry='5.2' transform='rotate(45 13 13)'/><ellipse cx='13' cy='6.5' rx='3.2' ry='5.2' transform='rotate(90 13 13)'/><ellipse cx='13' cy='6.5' rx='3.2' ry='5.2' transform='rotate(135 13 13)'/><ellipse cx='13' cy='6.5' rx='3.2' ry='5.2' transform='rotate(180 13 13)'/><ellipse cx='13' cy='6.5' rx='3.2' ry='5.2' transform='rotate(225 13 13)'/><ellipse cx='13' cy='6.5' rx='3.2' ry='5.2' transform='rotate(270 13 13)'/><ellipse cx='13' cy='6.5' rx='3.2' ry='5.2' transform='rotate(315 13 13)'/></g><circle cx='13' cy='13' r='3.4' fill='%23EDC25A' stroke='%23B8893A' stroke-width='.6'/></svg>") center / 18px no-repeat, url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 16'><path d='M2 12 C8 2 20 1 28 5 C20 9 10 14 2 12Z' fill='%239DB57E' stroke='%236F8A55' stroke-width='.8'/></svg>") 0 16px / 16px 9px no-repeat;
  }
  .wood::before { left: -9px; }
  .wood::after { right: -9px; transform: scaleX(-1); }
  /* parchment buttons beside it */
  .garden-button { background: linear-gradient(180deg, #FFFBF1, #F5EAD4); box-shadow: 0 1.5px 0 rgba(110,78,51,0.18); }
  .linkish {
    margin-top: 10px;
    border: 0;
    background: none;
    color: var(--ink-soft);
    font: 500 14.5px/1 var(--font);
    padding: 8px 12px;
    cursor: pointer;
    text-decoration: underline dashed color-mix(in srgb, var(--walnut) 45%, transparent);
    text-underline-offset: 4px;
    touch-action: manipulation;
  }

  /* ---------- Landing ---------- */
  header, footer { transition: opacity 500ms var(--ease-out); }
  body.titling header, body.titling footer { opacity: 0; visibility: hidden; }
  #title {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 16px calc(env(safe-area-inset-bottom, 0px) + 22px);
    text-align: center;
    pointer-events: none;
    transition: opacity 450ms var(--ease-out), transform 450ms var(--ease-out);
  }
  #title.leaving { opacity: 0; transform: translateY(-8px); }
  #title .t-top, #title .t-bottom { position: relative; justify-self: center; width: min(100%, 420px); }
  #title .t-bottom { grid-row: 3; }
  /* a soft haze of paper behind the words, so the garden never fights them */
  #title .t-top::before, #title .t-bottom::before {
    content: "";
    position: absolute;
    inset: -26px -40px;
    z-index: -1;
    background: radial-gradient(closest-side, var(--ground) 55%, color-mix(in srgb, var(--ground) 0%, transparent));
  }
  /* over the painted garden, words carry their own soft paper glow */
  /* over the painted garden, the words sit on small paper labels, like seed-packet tags */
  body.painted #t-status:not(:empty), body.painted #t-note:not(:empty), body.painted #garden-invitation:not(:empty), body.painted #hint:not(:empty), body.painted #title .tagline {
    width: fit-content; max-width: 100%; margin-inline: auto; box-sizing: border-box;
    padding: 5px 14px; border-radius: 14px;
    background: color-mix(in srgb, var(--ground) 90%, transparent);
    box-shadow: 0 1px 0 rgba(110,78,51,0.16), 0 2px 10px rgba(80,70,40,0.12);
    color: var(--ink);
  }
  /* over the painted garden, only a light veil right behind the words */
  body.painted #title .t-top::before, body.painted #title .t-bottom::before {
    inset: -8px -12px; opacity: 0.62;
    background: radial-gradient(closest-side, var(--ground) 35%, color-mix(in srgb, var(--ground) 0%, transparent));
  }
  .logo {
    margin: 0;
    font-family: var(--serif);
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-size: clamp(76px, 24vw, 116px);
    font-weight: 480;
    letter-spacing: -0.03em;
    line-height: 0.95;
    color: var(--ink);
  }
  .logo span { display: inline-block; }
  .logo span:nth-child(3) { color: #D9667E; }
  .logo span:nth-child(4) { color: #B06CB8; }
  .tagline {
    margin: 8px 0 0;
    font-size: 17px;
    color: var(--ink-soft);
    text-wrap: balance;
  }
  .t-status { margin: 0 0 14px; font-size: 14px; color: var(--ink-soft); text-wrap: balance; }
  .t-note { margin: 12px 0 0; font-size: 13.5px; color: var(--bud-deep); min-height: 1em; text-wrap: balance; }
  #play { width: min(100%, 300px); pointer-events: auto; font-size: 18px; }
  #title.enter .logo span { animation: letter 760ms var(--spring) both; animation-delay: calc(var(--i) * 70ms + 150ms); }
  #title.enter .tagline { animation: fade 700ms var(--ease-out) 650ms both; }
  #title.enter .t-bottom { animation: rise 700ms var(--spring) 850ms both; }
  #title .logo span { animation-play-state: running; }

  button:focus-visible { outline: 2px solid var(--walnut) !important; outline-offset: 2px !important; }
  .haptic { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }

  /* Ribbon banners for big moments: a stitched patch that springs open, letters bouncing in one by one. */
  #banner { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  .ribbon { position: fixed; left: 50%; transform: translate(-50%, -50%); animation: ribbon-out 450ms ease-in 1.45s forwards; }
  .ribbon.big { animation-delay: 2.1s; }
  .ribbon-in {
    padding: 8px 24px 10px;
    background: var(--chip);
    border: 1px solid var(--hairline);
    outline: 1.5px dashed var(--stitch);
    outline-offset: -6px;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(110, 80, 50, 0.2), 0 2px 0 rgba(110, 80, 50, 0.12);
    text-align: center;
    white-space: nowrap;
    animation: unroll 560ms var(--spring) both;
  }
  .ribbon .word {
    font-family: var(--serif);
    font-variation-settings: "SOFT" 100, "opsz" 96;
    font-size: 32px;
    font-weight: 500;
    color: var(--bud-deep);
    line-height: 1.1;
  }
  .ribbon.big .ribbon-in { padding: 12px 30px 14px; background: linear-gradient(180deg, #FFF8EC, #FBEEDF); }
  .ribbon.big .word { font-size: 46px; }
  .ribbon.big .word span:nth-child(4n + 1) { color: #D9667E; }
  .ribbon.big .word span:nth-child(4n + 2) { color: #B06CB8; }
  .ribbon.big .word span:nth-child(4n + 3) { color: #C98A2E; }
  .ribbon.big .word span:nth-child(4n) { color: #6E8A4A; }
  .ribbon .word span { display: inline-block; animation: letter 640ms var(--spring) both; animation-delay: calc(var(--i) * 40ms + 120ms); }
  .ribbon .sub { margin-top: 2px; font-size: 13px; color: var(--ink-soft); animation: fade 500ms var(--ease-out) 450ms both; }
  @keyframes unroll { from { opacity: 0; transform: scale(0.3, 0.5) rotate(-4deg); } }
  @keyframes letter { from { opacity: 0; transform: translateY(70%) scale(0.3) rotate(-14deg); } }
  @keyframes ribbon-out { to { opacity: 0; transform: translate(-50%, -80%) scale(0.95); } }
  .garden i.pop { animation: budpop 760ms var(--spring); }
  .stat-row { display: flex; align-items: center; gap: 6px; }
  .stat .seedtin b { font: 600 12px/1 var(--font); font-variation-settings: normal; }
  .seedtin { display: inline-flex; align-items: center; gap: 3px; margin-top: 6px; padding: 2px 7px 2px 5px; border-radius: 10px; background: var(--chip); border: 1px solid var(--hairline); color: var(--moss); font-size: 12px; vertical-align: middle; }
  .seedtin[hidden] { display: none; }
  .seedtin svg { width: 13px; height: 13px; }
  .seedtin b { color: var(--ink); font-weight: 600; }
  .seedtin.bump { animation: bump 520ms var(--spring); }
  @keyframes budpop { 45% { transform: rotate(-45deg) scale(1.9); } }

  .turn b.tick { animation: roll 520ms var(--ease-out); }
  .chip.bump { animation: bump 420ms var(--ease-out); }
  @keyframes roll { from { opacity: 0; transform: translateY(38%); } }
  @keyframes bump { 40% { transform: scale(1.12); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.98); } }
  @media (prefers-reduced-motion: reduce) {
    #over, .card, .turn b.tick, .chip.bump, #ff svg path, .ribbon-in, .ribbon .word span, .ribbon .sub, .garden i.pop,

<script>

    garden: $('#garden'), banner: $('#banner'),
    title: $('#title'), tStatus: $('#t-status'), tNote: $('#t-note'), play: $('#play'), toGarden: $('#to-garden'),
    cardCat: $('#card-cat'), haptic: $('#haptic'), app: $('#app'),

    inspection: $('#garden-inspection'), inspectionName: $('#inspection-name'), inspectionDescription: $('#inspection-description'),
    inspectionClose: $('#inspection-close'), invitation: $('#garden-invitation'),

    get(k, d) { try { const v = localStorage.getItem('bloom.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },

  const C = {};

    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');

  let bgCache = null;
  let gardenScene = null;
  function layout() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(3, window.devicePixelRatio || 1);

    canvas.height = Math.round(H * DPR);

    R = Math.max(40, Math.min(Math.min(W, 560) / 2 - 8, r.height / 2 - 4));
    coreR = R * 0.175;
    ballR = Math.max(3.5, R * 0.03);
    maxShape = R * 0.095;
    innerR = R * 0.31;
    outerR = R - maxShape - R * 0.02;

  }

    if (f >= 1) return innerR + dr * (f - 1);
    return coreR + (innerR - coreR) * Math.max(0, f);
  }
  // Shapes are big near the rim and shrink toward Erwu, so staggered rings
  // pack like the seeds in a flower head without touching.
  function sizeAt(f) {
    const r = ringRadius(Math.max(1, f));
    return Math.min(maxShape, 0.47 * Math.hypot(dr, r * STEP / 2));
  }
  // Each step inward also turns half a slot, so the board spirals in.
  function itemAngle(it) { return (it.sector + it.rf * 0.5) * STEP - Math.PI / 2; }
  function itemPos(it) {
    const a = itemAngle(it), rr = ringRadius(it.rf);

  function collideShape(b, it) {

      const ex = bx - ax, ey = by - ay;

  // ---------- Background (painted once per resize) ----------

    }

    gr.addColorStop(0, rgb(hexRgb(C.sage), 0.42)); gr.addColorStop(0.45, rgb(hexRgb(C.halo), 0.7)); gr.addColorStop(1, rgb(hexRgb(C.halo), 0));

  // ---------- Drawing ----------

    { k: 'rose', cols: ['#E68A9E', '#F2B3C0', '#F3BE9C', '#D98FB0'], petals: 9 },
    { k: 'peony', cols: ['#F0B2C4', '#F8D0DA', '#E6A2C6', '#F6C3B0'], petals: 11 },

  // A band of woven wicker: a walnut hoop with short slanted strands.

    const origin = sceneOrigin();
    ctx.translate(origin.x, origin.y);
    // plants waking from rest pop up in the live layer, then join the painted garden
    for (const [id, t0] of waking) {
      const pl = garden.plants.find((q) => q.id === id), t = (now - t0) / 650;
      if (!pl || t >= 1) { waking.delete(id); gardenDirty = true; continue; }
      const q = plantXY(pl), k = easeOutBack(Math.max(0.01, t));
      ctx.save(); ctx.translate(q.x, q.y); ctx.scale(k, k); ctx.translate(-q.x, -q.y);
      drawPlant(ctx, pl);
      ctx.restore();
    }
    if (paintedRest != null && Math.abs(shownRest - paintedRest) > 0.012) gardenDirty = true;
    // plants that have just sprouted grow in live before joining the painted garden
    for (const pl of growing) {
      const q = plantXY(pl), k = reduced ? 1 : easeOutBack(Math.min(1, pl.live));
      ctx.save(); ctx.translate(q.x, q.y); ctx.scale(k, k); ctx.translate(-q.x, -q.y);
      drawPlant(ctx, pl);
      ctx.restore();
    }
    // On the landing page Erwu sleeps in a mossy clearing; the flower grows in around her when you play.
    const te = titleT * titleT * (3 - 2 * titleT);
    // the whole flower swells a touch at the moment of full bloom
    const zoom = raysFx > 0 ? 1 + 0.035 * Math.sin(Math.min(1, (1 - raysFx) / 0.35) * Math.PI) : 1;
    if (te < 1) {
      ctx.save();
      ctx.scale(zoom * (1 - 0.3 * te), zoom * (1 - 0.3 * te));
      ctx.rotate(-te * 0.35);
      ctx.globalAlpha = (1 - te) * arenaReveal;
      drawFlower(now);
      if (raysFx > 0) drawRays(now);
      drawAim(now);
      for (const it of items) {
        if (it.dead) continue;
        if (it.kind === 'shape') { drawBud(it, now); if (it.seed) drawSeedPod(it, now); } else drawPickup(it, now);
      }
      for (const b of blooms) drawBloom(b);
      ctx.restore();
    }
    drawFlights();

    const goldA = hexRgb(C.honey);
    for (const p of particles) {
      const a = Math.max(0, Math.min(1, p.life * 1.4));
      if (p.type === 'dust') {
        ctx.fillStyle = rgb(goldA, a);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
        continue;
      }
      if (p.type === 'glint') {
        // a dewdrop catching the light: a four-point twinkle
        const k = Math.sin(Math.min(1, p.life) * Math.PI), r = p.size * (0.4 + 0.6 * k);
        ctx.fillStyle = rgb(WHITE, 0.9 * k);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - r); ctx.quadraticCurveTo(p.x, p.y, p.x + r, p.y); ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + r);
        ctx.quadraticCurveTo(p.x, p.y, p.x - r, p.y); ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - r);
        ctx.fill();
        ctx.fillStyle = rgb(hexRgb(C.sky), 0.35 * k);
        ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.35, 0, TAU); ctx.fill();
        continue;
      }
      if (p.delay > 0) continue;
      if (p.type === 'fluff') {
        ctx.strokeStyle = rgb(WHITE, Math.min(0.9, p.life)); ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + p.size * 2.2); ctx.stroke();
        for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + (k - 2) * 0.45; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(a) * p.size * 1.6, p.y + Math.sin(a) * p.size * 1.6); ctx.stroke(); }
        continue;
      }
      if (p.type === 'ripple') {
        ctx.strokeStyle = rgb(hexRgb(C.sky), p.life * 0.9); ctx.lineWidth = 1 + p.life * 2.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - p.life * 0.85), 0, TAU); ctx.stroke();
        continue;
      }
      if (p.type === 'drop') {
        ctx.fillStyle = rgb(mix('#FFFFFF', C.sky, 0.5), a);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
        continue;
      }
      if (p.type === 'flutter') {
        const flip = Math.cos(p.ph);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, 0.2 + 0.8 * Math.abs(flip));
        bentPetal(ctx, -p.size * 0.5, 0, 0, p.size, p.size * p.wid, p.bend, rgb(flip > 0 ? p.col : mixA(p.col, hexRgb(C['bud-deep']), 0.15), Math.min(1, p.life * 1.6)));
        ctx.restore();
        continue;
      }
      if (p.type === 'heart') {
        const s = p.size * (0.6 + 0.4 * Math.min(1, (1 - p.life) * 5));
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.fillStyle = C['petal-bloom']; ctx.strokeStyle = rgb(mix(C['petal-bloom'], C['bud-deep'], 0.4)); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, s * 0.9);
        ctx.bezierCurveTo(-s * 1.4, -s * 0.1, -s * 0.6, -s * 1.1, 0, -s * 0.35);
        ctx.bezierCurveTo(s * 0.6, -s * 1.1, s * 1.4, -s * 0.1, 0, s * 0.9);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-s * 0.45, -s * 0.35, s * 0.2, s * 0.12, -0.6, 0, TAU); ctx.fill();
        ctx.restore(); ctx.globalAlpha = 1;
        continue;
      }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = rgb(mixA(p.col, WHITE, 0.25), a);
      lens(ctx, p.size); ctx.fill();
      ctx.restore();
    }

    const honey = hexRgb(C.honey), hsoft = hexRgb(C['honey-soft']);
    // Balls are pollen: a warm glow, a lit sphere, and a trail of fading dust.
    if (balls.length) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rgb(hexRgb(C.butter), 0.16);
      ctx.beginPath();
      for (const b of balls) { ctx.moveTo(b.x + ballR * 2.6, b.y); ctx.arc(b.x, b.y, ballR * 2.6, 0, TAU); }
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    for (const b of balls) {
      const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp;
      [[1.7, 0.55, 0.45], [2.9, 0.4, 0.3], [4, 0.28, 0.16]].forEach(([d, r, a]) => {
        ctx.fillStyle = rgb(honey, a);
        ctx.beginPath(); ctx.arc(b.x - ux * ballR * d, b.y - uy * ballR * d, ballR * r, 0, TAU); ctx.fill();
      });
      ctx.fillStyle = rgb(hsoft, 0.4);
      ctx.beginPath(); ctx.arc(b.x, b.y, ballR * 1.8, 0, TAU); ctx.fill();
      const pf = artImage('play') && ART.play.frames.pollen;
      if (pf) {
        // the painted grain: its glow is part of the painting, so it is drawn a little larger
        const d = ballR * 3.4 * pf[2] / pf[3];
        ctx.drawImage(artImage('play'), pf[0], pf[1], pf[2], pf[3], b.x - d / 2 - ballR * 0.35, b.y - ballR * 1.7 + ballR * 0.1, d, ballR * 3.4);
      } else {
        const bg = ctx.createRadialGradient(b.x - ballR * 0.35, b.y - ballR * 0.4, ballR * 0.1, b.x, b.y, ballR);
        bg.addColorStop(0, '#FFF3D6'); bg.addColorStop(0.55, rgb(mixA(honey, WHITE, 0.2))); bg.addColorStop(1, rgb(honey));
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(b.x, b.y, ballR, 0, TAU); ctx.fill();
      }
      if (b.gold) {
        // golden pollen: a brighter glow and a twinkle
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = rgb(hexRgb(C.butter), 0.45);
        ctx.beginPath(); ctx.arc(b.x, b.y, ballR * 2.1, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(b.x - ballR * 1.6, b.y); ctx.lineTo(b.x + ballR * 1.6, b.y); ctx.moveTo(b.x, b.y - ballR * 1.6); ctx.lineTo(b.x, b.y + ballR * 1.6); ctx.stroke();
      }
    }
    drawBeesAndBeams();

    // The golden heart of the flower: a ring of stamens around Erwu's cushion.
    const st = hexRgb(C.stamen);
    ctx.globalAlpha = 1 - te;
    for (let i = 0; i < 22 && te < 1; i++) {
      const a = i * TAU / 22 + 0.07, long = i % 2 === 0;
      const r1 = coreR * (long ? 1.3 : 1.18) + stamenFx * coreR * 0.14 * (long ? 1 : 0.6);
      ctx.strokeStyle = rgb(st, 0.8); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * coreR * 0.96, Math.sin(a) * coreR * 0.96); ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.stroke();
      ctx.fillStyle = rgb(honey, long ? 0.95 : 0.7);
      ctx.beginPath(); ctx.arc(Math.cos(a) * r1, Math.sin(a) * r1, long ? Math.max(1.6, ballR * 0.36) : Math.max(1.2, ballR * 0.26), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const nestR = presentation === 'garden' && gardenScene ? gardenScene.nest : coreR;
    // the painted garden holds her basket in the rose bed; a run and the end card use it alone
    const runBasket = presentation === 'run' && artImage('garden') && artImage('erwu') ? basketPlacement(nestR * 1.5) : null;
    if (runBasket) { ctx.save(); ctx.translate(0, -nestR * 0.38); drawBasket(ctx, runBasket); ctx.restore(); }
    else if (!paintedGarden()) drawNest(ctx, nestR);
    if (launchFx > 0) {
      ctx.strokeStyle = rgb(hexRgb(C.butter), launchFx * 0.8); ctx.lineWidth = 2 + launchFx * 2;
      ctx.beginPath(); ctx.arc(0, 0, coreR * 1.1 + (1 - launchFx) * R * 0.22, 0, TAU); ctx.stroke();
    }
    if (swatFx > 0) {
      ctx.strokeStyle = rgb(honey, swatFx * 0.8); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, coreR + (1 - swatFx) * R * 0.35, 0, TAU); ctx.stroke();
    }
    if (presentation === 'garden') drawErwuGarden(now, nestR);
    else if (runBasket) { ctx.save(); ctx.translate(0, -nestR * 0.38); drawBasketCat(ctx, runBasket, catPose(), now); ctx.restore(); }
    else drawCat(ctx, nestR, now, catPose());
    if (presentation === 'run' && te > 0.2 && cat.mood === 'sleepy' && !reduced) {
      // z's drifting up from a sleeping Erwu
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let i = 0; i < 3; i++) {
        const t = ((now / 1700) + i / 3) % 1;
        ctx.font = `600 ${Math.round(nestR * (0.22 + t * 0.2))}px ${SERIF}`;
        ctx.fillStyle = rgb(hexRgb(C['bud-deep']), Math.sin(t * Math.PI) * 0.65 * te);
        ctx.fillText('z', nestR * (0.7 + t * 0.5 + Math.sin(t * 6 + i) * 0.08), -nestR * (0.75 + t * 0.9));
      }
    }

    // petal charge: three small petals around Erwu
    if (presentation === 'run' && petalNext && state !== 'over') {
      const base = (aim && aim.angle != null) ? aim.angle : now / 2000;
      for (let k = 0; k < 3; k++) {
        const a = base + k * TAU / 3, r = coreR + ballR * 2.4;
        ctx.save(); ctx.translate(Math.cos(a) * r, Math.sin(a) * r); ctx.rotate(a + Math.PI / 2);
        ctx.fillStyle = rgb(honey, 0.9); lens(ctx, ballR * 1.2); ctx.fill();
        ctx.restore();
      }
    }

    drawFlies();
    for (const f of floats) {
      const alpha = Math.min(1, f.life * 1.6);
      ctx.font = `500 ${Math.round(R * 0.085 * f.scale)}px ${SERIF}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, R * 0.028);
      ctx.strokeStyle = rgb(hexRgb(C.arena), alpha * 0.92);
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = rgb(hexRgb(C[f.color] || C.ink), alpha);
      ctx.fillText(f.text, f.x, f.y);
    }

    // thumb joystick: where you pressed, and how far you've pulled
    if (aim && aim.sx != null) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const ink = hexRgb(C['bud-deep']);
      const dx = aim.cx - aim.sx, dy = aim.cy - aim.sy, len = Math.hypot(dx, dy), max = 46;
      const k = len > max ? max / len : 1;
      ctx.strokeStyle = rgb(ink, 0.22); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(aim.sx, aim.sy, max, 0, TAU); ctx.stroke();
      ctx.fillStyle = rgb(ink, 0.08);
      ctx.beginPath(); ctx.arc(aim.sx, aim.sy, AIM_DEAD, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgb(ink, 0.25);
      ctx.beginPath(); ctx.moveTo(aim.sx, aim.sy); ctx.lineTo(aim.sx + dx * k, aim.sy + dy * k); ctx.stroke();
      ctx.fillStyle = aim.target != null ? rgb(hexRgb(C.honey), 0.95) : rgb(ink, 0.3);
      ctx.beginPath(); ctx.arc(aim.sx + dx * k, aim.sy + dy * k, 9, 0, TAU); ctx.fill();
    }
    if (confetti.length) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawConfetti(); }
    if (!el.over.hidden) drawCardCat(now);
  }

  // ---------- Input ----------
  // Pull back like a slingshot: the shot flies opposite to your drag.
  // Inside the small dead zone the aim holds still instead of flipping.
  const AIM_DEAD = 22;
  function aimFrom(e) {
    aim.cx = e.clientX; aim.cy = e.clientY;
    const dx = aim.sx - e.clientX, dy = aim.sy - e.clientY;
    if (Math.hypot(dx, dy) > AIM_DEAD) { aim.target = Math.atan2(dy, dx); if (!aim.t0) aim.t0 = performance.now(); }
  }
  el.app.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button') || aim || e.button !== 0) return;
    if (presentation !== 'run' || state !== 'ready' || !el.over.hidden) return;
    aim = { sx: e.clientX, sy: e.clientY, cx: e.clientX, cy: e.clientY, target: null, angle: null, id: e.pointerId, t0: 0 };
    cat.mood = 'watch';
    try { el.app.setPointerCapture(e.pointerId); } catch {}
  });
  el.app.addEventListener('pointermove', (e) => {
    if (!aim || e.pointerId !== aim.id) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    aimFrom(events.length ? events[events.length - 1] : e);
  });
  const release = (e) => {
    if (!aim || e.pointerId !== aim.id) return;
    const pulled = Math.hypot(aim.sx - e.clientX, aim.sy - e.clientY);
    const a = aim.angle != null ? aim.angle : aim.target;
    clearAim();
    // Letting go back near the start cancels the shot.
    if (e.type === 'pointerup' && a != null && pulled > AIM_DEAD * 0.6) { keyAim = a; launch(a); }
  };
  el.app.addEventListener('pointerup', release);
  el.app.addEventListener('pointercancel', () => clearAim());
  el.app.addEventListener('lostpointercapture', () => { aim = null; });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (presentation === 'garden') {
        if (plantingDraft || replanting) { resetPlanting(); refreshInspection(); }
        else closeInspection(true);
      }
      else { clearAim(); gardenRequested = false; updateHud(); }
      return;
    }
    if (e.target.closest('button, select, input, textarea')) return;
    if (presentation !== 'run' || state !== 'ready' || !el.over.hidden) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      keyAim += (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 0.01 : 0.05);
      aim = { angle: keyAim, target: keyAim, id: 'key', t0: aim && aim.t0 ? aim.t0 : performance.now() };
      cat.mood = 'watch';
      e.preventDefault();
    } else if ((e.key === ' ' || e.key === 'Enter') && aim && aim.id === 'key') {
      const a = aim.angle; aim = null; launch(a);
      e.preventDefault();
    }
  });

  el.erwuTouch.addEventListener('click', greetErwu);
  el.seedTin.addEventListener('click', () => { if (tinOpen) closeInspection(true); else openTin(); });
  el.bedPlant.addEventListener('click', commitPlanting);
  el.bedCancel.addEventListener('click', () => { resetPlanting(); refreshInspection(); });
  el.bedReplant.addEventListener('click', () => { replanting = true; refreshInspection(); el.bedChoices.querySelector('button')?.focus({ preventScroll: true }); });
  el.bedFocus.addEventListener('click', () => {
    const bed = garden.patches.find((p) => p.id === inspectedObject);
    if (bed && BloomBeds.setFocus(garden, bed.id)) { saveGarden(); refreshInspection(); showStatus(); }
  });
  el.inspectionClose.addEventListener('click', () => closeInspection(true));
  el.scene.addEventListener('pointerdown', (e) => {
    if (presentation !== 'garden' || e.target.closest('button') || scenePress || e.button !== 0) return;
    scenePress = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
    el.scene.setPointerCapture(e.pointerId);
  });
  el.scene.addEventListener('pointermove', (e) => {
    if (scenePress && scenePress.id === e.pointerId && Math.hypot(e.clientX - scenePress.x, e.clientY - scenePress.y) > 10) scenePress.moved = true;
  });
  el.scene.addEventListener('pointerup', (e) => {
    if (!scenePress || scenePress.id !== e.pointerId) return;
    const tapped = !scenePress.moved && Math.hypot(e.clientX - scenePress.x, e.clientY - scenePress.y) <= 10;
    clearAim();
    if (!tapped || presentation !== 'garden' || !gardenScene) return;
    clearTimeout(settleTimer); el.title.classList.add('settled');
    // Wild plants grow on their own; tapping the lawn just closes whatever is open.
    closeInspection();
  });
  el.scene.addEventListener('pointercancel', () => clearAim());
  el.scene.addEventListener('lostpointercapture', () => { scenePress = null; });
  window.addEventListener('blur', clearAim);

  el.ff.addEventListener('click', () => { timeScale = timeScale > 1 ? 1 : 3; updateHud(); });
  el.sound.addEventListener('click', () => { setSound(!soundOn); if (soundOn) tone(noteFreq(7), 0.04); });
  el.again.addEventListener('click', () => { el.app.inert = false; newGame(); stage.focus({ preventScroll: true }); });
  el.toGarden.addEventListener('click', showTitle);
  el.visitGarden.addEventListener('click', requestGarden);
  el.play.addEventListener('click', leaveTitle);
  el.restart.addEventListener('click', () => {
    if (presentation !== 'run' || state === 'flying' || state === 'advancing') return;
    if (restartArmed) {
      restartArmed = false; clearTimeout(restartTimer);
      el.restart.classList.remove('armed');
      newGame();
      return;
    }
    restartArmed = true;
    el.restart.classList.add('armed');
    el.hint.className = '';
    el.hint.textContent = 'Tap again to start over';
    restartTimer = setTimeout(() => { restartArmed = false; el.restart.classList.remove('armed'); updateHud(); }, 2600);
  });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!document.hidden) { update(dt); draw(now); }
    requestAnimationFrame(frame);
  }

  function start(data) {
    readTheme();
    layout();
    seedDrift();
    new ResizeObserver(() => { layout(); }).observe(stage);
    new ResizeObserver(measureGarden).observe(el.scene);
    window.addEventListener('resize', layout);
    setSound(soundOn);
    welcomeBack();
    if (garden.fresh) {
      // a brand-new garden: a few sprouts around the bed to start from
      delete garden.fresh;
      for (let i = 0; i < 6; i++) plant(i % 2 ? 'grass' : pick(['clover', 'daisy', 'cosmos']), null, 0.12 + Math.random() * 0.15, 1.06, 1.4);
      saveGarden();
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { clearAim(); garden.lastSeen = Date.now(); saveGarden(); }
      else { welcomeBack(); saveGarden(); updateHud(); if (presentation === 'garden' && greetPending) erwuEnter(); }
    });
    window.addEventListener('pagehide', saveGarden);
    const run = (data && data.run) || store.get('run3', null);
    if (run && run.v === 3 && run.items && run.items.length) { restore(run); markReady(); }
    else newGame();
    updateHud();
    showTitle();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { updateHud(); });
    requestAnimationFrame(frame);
  }

  window.claude?.hot?.snapshot?.(() => ({ run: state === 'over' ? null : readySnapshot }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
